  /api/webhooks/{agent_id}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [Webhooks]
      summary: Invoke an agent by webhook
      description: |
        This is an **incoming webhook**: you (or an external service) POST data
        into Maritime, which delivers it to the agent.

        Accepts any JSON payload and delivers it to the agent in the
        background, waking the agent first if it is asleep. The call returns
        as soon as the payload is accepted; it does not wait for the agent.

        Authenticate with the agent's invoke token, either in the
        `X-Maritime-Webhook-Token` header or the `token` query parameter. Get
        the token from [Get the webhook token](#operation/getWebhookToken).
        Your `mk_` API key is not used here.

        **Token enforcement is not on yet.** Calls with a missing or wrong
        token are currently accepted. Maritime says unauthenticated calls are
        being phased out, so always send the token.

        Invokes are rate limited to 30 per minute per agent and caller, and
        share the agent's message budget. Over the limit, the call returns
        `429` with a `Retry-After` header (in seconds); requests are not
        queued.

        The body isn't validated. Plain text, invalid JSON, an empty body and
        a JSON array are all accepted with `200` and delivered.
      operationId: invokeAgentWebhook
      security:
        - WebhookTokenHeader: []
        - WebhookTokenQuery: []
        - {}
      requestBody:
        required: false
        description: Any JSON object, delivered to the agent as-is. Other bodies are also accepted (see above).
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example:
              event: order.created
              orderId: A-1001
      responses:
        '200':
          description: |
            The payload was accepted for delivery. While token enforcement is
            off, the response is the agent record (with `status` as of
            acceptance). Once enforcement is on, Maritime says it will be
            `{"status": "accepted"}`.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Agent'
                  - $ref: '#/components/schemas/WebhookAccepted'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '429':
          description: Rate limit exceeded (30 invokes per minute per agent and caller).
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
              example: 44
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: 'Rate limit exceeded: 30/min for public-webhook'
      x-verification:
        status: partial
        date: '2026-10-04'
        notes: >-
          Header token, query token, no token and a wrong token all returned
          200 with the agent record, and all four payloads reached the agent
          (logged as "Webhook received with N keys", source "webhook"). No
          deprecation header is sent. On 2026-10-04: after 8 invokes, a burst
          of 35 got 22 x 200 then 13 x 429, so the 31st call in the minute was
          refused, with Retry-After 44 and the detail shown above; text/plain,
          invalid JSON and an empty body were delivered as "0 keys", and a
          3-item array as "3 keys". The {"status": "accepted"} shape only
          appears once Maritime enforces tokens, and wasn't observed.

  /api/webhooks/{agent_id}/token:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Webhooks]
      summary: Get the webhook token
      description: |
        Returns the agent's invoke token and a ready-to-use invoke URL with
        the token in its query string. The token is derived from the agent,
        so it stays the same for the agent's lifetime unless you rotate it.
        Treat it as a secret: anyone holding it can invoke the agent.
      operationId: getWebhookToken
      responses:
        '200':
          description: The invoke token and URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookToken'
              example:
                agentId: e25829dd-175b-4be2-97b8-f0939bb9de9f
                token: wht_REDACTED
                header: X-Maritime-Webhook-Token
                url: https://api.maritime.sh/api/webhooks/e25829dd-175b-4be2-97b8-f0939bb9de9f?token=wht_REDACTED
                source: derived
        '401':
          $ref: '#/components/responses/InvalidKey'
        '403':
          $ref: '#/components/responses/MissingKey'
        '404':
          $ref: '#/components/responses/AgentNotFound'
      x-verification:
        status: verified
        date: '2026-10-04'
        notes: >-
          Token value redacted in the example; its real format is not shown
          here. Two calls on 2026-10-04 returned the same token.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        A personal API key with the `mk_` prefix. Mint one in the dashboard
        (**Settings → API keys**) or with `maritime keys create`.
    WebhookTokenHeader:
      type: apiKey
      in: header
      name: X-Maritime-Webhook-Token
      description: The agent's invoke token. Only used by the webhook invoke endpoint.
    WebhookTokenQuery:
      type: apiKey
      in: query
      name: token
      description: The agent's invoke token, as a query parameter. Only used by the webhook invoke endpoint.

  parameters:
    AgentId:
      name: agent_id
      in: path
      required: true
      description: The agent's ID (a UUID), as returned in the `id` field of an agent.
      schema:
        type: string
        format: uuid
      example: e25829dd-175b-4be2-97b8-f0939bb9de9f

  responses:
    MissingKey:
      description: No `Authorization` header was sent, or the key was sent without the `Bearer` prefix or in `X-API-Key`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: Not authenticated
    InvalidKey:
      description: The API key is invalid, expired, revoked, or lacks access to this surface (e.g. scoped keys on core routes).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: Invalid token
    AgentNotFound:
      description: No agent with this ID exists on your account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: Agent e25829dd-175b-4be2-97b8-f0939bb9de9f not found
    InvalidPath:
      description: The path is outside the agent's persistent volume.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: Invalid path
    ValidationFailed:
      description: A required field or parameter is missing or has the wrong type.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            detail:
              - type: missing
                loc: [body, name]
                msg: Field required
                input:
                  templateId: zeroclaw

  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: A human-readable description of the error.
          example: Agent e25829dd-175b-4be2-97b8-f0939bb9de9f not found

    PlanLimitError:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: A human-readable explanation, including the plan's limit and a billing link.
        code:
          type: string
          description: 'A machine-readable reason. Observed value: `seat_limit` (the plan''s agent limit).'
          example: seat_limit
        upgrade:
          type: boolean
          description: Whether upgrading the plan would lift the limit.
          example: true

    ValidationError:
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          description: One entry per invalid field or parameter.
          items:
            $ref: '#/components/schemas/ValidationIssue'

    ValidationIssue:
      type: object
      required: [type, loc, msg]
      properties:
        type:
          type: string
          description: A machine-readable error type, such as `missing` or `less_than_equal`.
          example: missing
        loc:
          type: array
          description: 'Where the problem is: the request part (`body`, `query` or `path`) followed by the field name.'
          items:
            oneOf:
              - type: string
              - type: integer
          example: [body, name]
        msg:
          type: string
          description: A human-readable description of the problem.
          example: Field required
        input:
          description: The value that failed validation. Any JSON type, or null.
        ctx:
          type: object
          description: Extra details about the constraint that failed, such as `le` for a maximum.
          additionalProperties: true

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: '`ok` when the API is up.'
          example: ok
        runtime:
          type: string
          description: The runtime the API is running on.
          example: fleet
        event_loop:
          type: object
          description: Server event-loop latency statistics. Internal; may change.
          additionalProperties: true
        leader:
          type: object
          description: Scheduler leader-election state. Internal; may change.
          additionalProperties: true
        deploy_queue:
          type: object
          description: Deployment queue depth. Internal; may change.
          additionalProperties: true

    Template:
      type: object
      required: [id, name, framework]
      properties:
        id:
          type: string
          description: The template ID. Pass it as `templateId` when creating an agent.
          example: zeroclaw
        name:
          type: string
          description: Display name.
          example: ZeroClaw Agent
        framework:
          type: string
          description: The agent framework the template runs. Templates built on a custom container report `custom`.
          example: zeroclaw
        image:
          type: string
          description: The container image the template deploys.
          example: ghcr.io/zeroclaw-labs/zeroclaw:v0.8.5-debian
        description:
          type: string
          description: A short description of the template.
          example: Ultra-lightweight Rust AI agent. <5MB RAM, instant startup.
        tags:
          type: array
          description: Display tags.
          items:
            type: string
          example: [Lightweight, Rust]
        envRequired:
          type: array
          description: |
            Environment variables expected by the template. Most templates
            route through Maritime's LLM proxy by default if omitted; only
            templates unsupported by the proxy (like Claude Code) require the
            key to reach the model. An empty array means none.
          items:
            type: string
          example: []
        videoUrl:
          type: string
          format: uri
          nullable: true
          description: A demo video URL, if there is one.
          example: https://maritime.sh/videos/templates/zeroclaw.mp4
        hidden:
          type: boolean
          description: Whether the template is hidden from the public library.
          example: false

    AgentCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: A name for the agent.
          example: my-agent
        templateId:
          type: string
          nullable: true
          description: The template to create from (see List templates). Sets `framework` automatically.
          example: zeroclaw
        description:
          type: string
          nullable: true
          description: A free-text description of the agent.
        instructions:
          type: string
          nullable: true
          description: Instructions for the agent.
        externalId:
          type: string
          nullable: true
          description: Your own identifier for the user this agent belongs to. Usage reports include it as `externalUserId`.
        framework:
          type: string
          default: custom
          description: The agent framework. Set to `custom` when deploying your own repo or image; otherwise let `templateId` set it.
          example: custom
        githubRepo:
          type: string
          nullable: true
          description: A GitHub repository URL with a Dockerfile at its root. Requires `framework` set to `custom`.
          example: https://github.com/acme/agent
        branch:
          type: string
          nullable: true
          description: The branch to build when using `githubRepo`.
          example: main
        imageName:
          type: string
          nullable: true
          description: A public container image to deploy. Private registries are not supported. Requires `framework` set to `custom`.
          example: ghcr.io/acme/agent:1.4.0
        initialEnvVars:
          type: array
          description: Environment variables to set on the agent at creation. Secret values are encrypted.
          items:
            $ref: '#/components/schemas/InitialEnvVar'
        useMaritimeLlm:
          type: boolean
          default: false
          description: Inject Maritime's metered LLM proxy credentials (`OPENAI_API_KEY` and `OPENAI_BASE_URL`) into the agent.
        tier:
          type: string
          default: always_on
          description: The agent's hosting tier. Only `always_on` has been observed.
        memMb:
          type: integer
          nullable: true
          description: Memory in MB. Leave unset for the default size.
        vcpus:
          type: number
          nullable: true
          description: Number of virtual CPUs. Leave unset for the default size.
        diskGb:
          type: number
          nullable: true
          description: Persistent volume size in GB. Leave unset for the default size.
        idleTtlSeconds:
          type: integer
          nullable: true
          description: Seconds of inactivity before the agent sleeps. Leave unset for the default.
        computeMinutesLimit:
          type: number
          nullable: true
          description: A cap on the agent's compute minutes. Unset means no cap.
        exposedPort:
          type: integer
          nullable: true
          description: For custom containers, the port your HTTP server listens on.
        healthCheckPath:
          type: string
          nullable: true
          description: For custom containers, the path that answers health checks (for example `/health`).
        hasWebUi:
          type: boolean
          default: true
          description: Whether the agent serves a web UI.
        publicWeb:
          type: boolean
          default: false
          description: Serve the agent on a public, no-login HTTPS URL.
        autoPair:
          type: boolean
          default: true
          description: Not described in the public docs.
        desktop:
          type: boolean
          default: false
          description: Not described in the public docs. The resulting agent field is `desktopEnabled`.
        gatewayPassword:
          type: string
          nullable: true
          description: Not described in the public docs.
        serverId:
          type: string
          nullable: true
          description: Not described in the public docs.
        uploadS3Key:
          type: string
          nullable: true
          description: Not described in the public docs. Appears to reference an uploaded ZIP for ZIP deploys.
        addOns:
          type: array
          description: Not described in the public docs. Billing add-ons include always-on, extra RAM and extra SSD.
          items:
            type: string

    InitialEnvVar:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
          example: OPENAI_API_KEY
        value:
          type: string
          example: sk-...
        isSecret:
          type: boolean
          default: true
          description: Store the value encrypted and hide it in the dashboard.

    Agent:
      type: object
      required: [id, name, framework, tier, status, invocationCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          description: The agent's ID.
        name:
          type: string
        description:
          type: string
          nullable: true
        instructions:
          type: string
          nullable: true
        externalId:
          type: string
          nullable: true
          description: Your identifier for the end user this agent belongs to, if set.
        framework:
          type: string
          description: The agent framework, for example `openclaw`, `zeroclaw`, `hermes`, `dsh` or `custom`.
          example: zeroclaw
        tier:
          type: string
          example: always_on
        status:
          type: string
          description: |
            The agent's state. Observed values: `deploying` (just created),
            `active` (running and ready) and `sleeping` (idle; wakes on the
            next call). Other values, such as error states, may exist but
            were not observed.
          example: active
        templateId:
          type: string
          nullable: true
          description: The template the agent was created from.
          example: zeroclaw
        githubRepo:
          type: string
          nullable: true
        autoPair:
          type: boolean
        exposedPort:
          type: integer
          nullable: true
        healthCheckPath:
          type: string
          nullable: true
        hasWebUi:
          type: boolean
        publicPlay:
          type: boolean
        publicWeb:
          type: boolean
          description: Whether the agent is served on a public URL.
        publicUrl:
          type: string
          nullable: true
          description: The public URL, when `publicWeb` is true.
        desktopEnabled:
          type: boolean
        invocationCount:
          type: integer
          description: How many times the agent has been invoked (chat and webhook).
        totalComputeSeconds:
          type: integer
          description: Total seconds the agent has been awake.
        memMb:
          type: integer
          nullable: true
          description: Memory override in MB, or null for the default.
        vcpus:
          type: number
          nullable: true
          description: vCPU override, or null for the default.
        idleTtlSeconds:
          type: integer
          nullable: true
          description: Idle-sleep override in seconds, or null for the default.
        diskMb:
          type: integer
          nullable: true
          description: Disk override in MB, or null for the default. Note the create field is `diskGb`.
        computeMinutesLimit:
          type: number
          nullable: true
        sleepPolicy:
          type: string
          example: auto-sleep
        lastStartedAt:
          type: string
          format: date-time
          nullable: true
        lastActiveAt:
          type: string
          format: date-time
          nullable: true
          description: When the agent last did work.
        derivedImageTag:
          type: string
          nullable: true
        browserbaseConfigured:
          type: boolean
        projectId:
          type: string
          nullable: true
          description: The project the agent belongs to. Some endpoints, such as channel setup, take this ID.
        projectRole:
          type: string
          nullable: true
          example: base
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: The message to send to the agent.
          example: summarize today
        conversation_id:
          type: string
          nullable: true
          description: |
            An ID of your choosing to continue an earlier thread. Whether the
            agent remembers earlier messages depends on its framework.
          example: support-thread-42

    ChatResponse:
      type: object
      required: [response]
      properties:
        response:
          type: string
          description: The agent's reply as plain text.
          example: Here's today's summary...

    ExecRequest:
      type: object
      required: [command]
      properties:
        command:
          description: The command to run, as argv tokens (quoted for you) or a raw shell string.
          oneOf:
            - type: array
              minItems: 1
              items:
                type: string
            - type: string
              minLength: 1
          example: [ls, -la, /data]
        timeout:
          type: integer
          minimum: 1
          maximum: 120
          default: 60
          description: |
            Seconds before the command is killed. Values above 120 aren't
            rejected; they are clamped to 120. A negative value fails at once
            with `502`. `0`, decimals and numeric strings are accepted without
            error; how they are interpreted isn't documented.
          example: 30

    ExecResponse:
      type: object
      required: [exitCode, stdout, stderr]
      properties:
        exitCode:
          type: integer
          description: The command's exit code.
          example: 0
        stdout:
          type: string
          description: Combined stdout and stderr, capped at 256 KiB. Truncated output keeps the last 256 KiB, prefixed with `[output truncated]\n`.
        stderr:
          type: string
          description: Currently always empty, because stderr is merged into `stdout`.
          example: ''

    LogEntry:
      type: object
      required: [id, agentId, level, message, timestamp, source]
      properties:
        id:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        level:
          type: string
          enum: [debug, info, warn, error]
        message:
          type: string
          example: Agent deployed and running
        timestamp:
          type: string
          format: date-time
          description: When the entry was written. Use it as `before` to fetch older entries.
        source:
          type: string
          description: 'Where the entry came from. Observed values: `system` (platform events), `container` (the agent process) and `webhook`.'
          example: system

    FileListing:
      type: object
      required: [path, root, entries]
      properties:
        path:
          type: string
          description: The directory that was listed.
          example: /zeroclaw-data
        root:
          type: string
          description: |
            The agent's volume root (e.g. `/data` for `openclaw`/`codex`/`dsh`,
            `/zeroclaw-data` for `zeroclaw`, `/opt/data` for `hermes`). Use it
            to build paths for the other file endpoints.
          example: /zeroclaw-data
        entries:
          type: array
          items:
            $ref: '#/components/schemas/FileEntry'

    FileEntry:
      type: object
      required: [name, isDir, size, mtime]
      properties:
        name:
          type: string
          example: notes.md
        isDir:
          type: boolean
          example: false
        size:
          type: integer
          description: Size in bytes.
          example: 182
        mtime:
          type: integer
          description: Last-modified time as Unix seconds.
          example: 1791027942

    UploadRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: The file to upload. Maximum 100 MB.
        dest_dir:
          type: string
          description: A directory in the volume to save the file to. Omit it to send the file as a chat attachment.
          example: /data/inbox
        message:
          type: string
          description: Text sent to the agent along with a chat attachment. Intended for when `dest_dir` is omitted; with `dest_dir` the file still goes to that directory.
          example: Here is the report, how many rows does it have?

    UploadResponse:
      type: object
      required: [ok, path, name, size]
      properties:
        ok:
          type: boolean
          example: true
        path:
          type: string
          description: Where the file was saved.
          example: /data/inbox/report.csv
        name:
          type: string
          description: The original file name.
          example: report.csv
        size:
          type: integer
          description: Size in bytes.
          example: 5321

    PathRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: An absolute path inside the agent's volume.
          example: /data/inbox

    WriteFileRequest:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
          description: An absolute file path inside the agent's volume.
          example: /data/notes.md
        content:
          type: string
          description: The full file contents, as UTF-8 text.
          example: "# Notes\n"

    PathResult:
      type: object
      required: [ok, path]
      properties:
        ok:
          type: boolean
          example: true
        path:
          type: string
          description: The path that was acted on.
          example: /data/notes.md

    MoveRequest:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          description: The existing path.
          example: /data/notes.md
        to:
          type: string
          description: The new path. Must not already exist.
          example: /data/archive/notes.md

    MoveResult:
      type: object
      required: [ok, from, to]
      properties:
        ok:
          type: boolean
          example: true
        from:
          type: string
          example: /data/notes.md
        to:
          type: string
          example: /data/archive/notes.md

    WebhookToken:
      type: object
      required: [agentId, token, header, url]
      properties:
        agentId:
          type: string
          format: uuid
        token:
          type: string
          description: The invoke token. Keep it secret.
        header:
          type: string
          description: The header name to send the token in.
          example: X-Maritime-Webhook-Token
        url:
          type: string
          format: uri
          description: The invoke URL with the token already in its query string.
        source:
          type: string
          description: How the token was produced. Observed value `derived`.
          example: derived

    WebhookAccepted:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted]
