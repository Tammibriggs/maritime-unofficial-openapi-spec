  /api/agents/{agent_id}/files/move:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [Files]
      summary: Move or rename a file
      description: |
        Moves or renames a file or directory within the agent's volume. Both
        `from` and `to` must be absolute paths inside the volume.

        - **Rename:** If `from` and `to` are in the same directory but have
          different names, the file or directory is renamed.
        - **Move:** If `to` specifies a different directory path, the file or
          directory is relocated to that directory. The item can also be
          renamed in the same request.

        The endpoint doesn't overwrite existing targets: if `to` already
        exists, the call returns `409 Conflict`. If `from` doesn't exist, it
        returns `404 Not Found`. Moving an item onto itself returns `400 Bad
        Request`.
      operationId: moveAgentFile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveRequest'
            example:
              from: /zeroclaw-data/oas/notes.md
              to: /zeroclaw-data/oas/inbox/notes.md
      responses:
        '200':
          description: The file or directory was moved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveResult'
              example:
                ok: true
                from: /zeroclaw-data/oas/notes.md
                to: /zeroclaw-data/oas/inbox/notes.md
        '400':
          description: '`from` or `to` is missing or outside the agent''s volume, or they are the same path.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidPath:
                  value:
                    detail: Invalid path
                samePath:
                  value:
                    detail: Source and destination are the same
        '401':
          $ref: '#/components/responses/InvalidKey'
        '403':
          $ref: '#/components/responses/MissingKey'
        '404':
          description: The source path doesn't exist, or the agent wasn't found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Source not found
        '409':
          description: The destination path already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Destination already exists
        '422':
          $ref: '#/components/responses/ValidationFailed'
      x-verification:
        status: verified
        date: '2026-10-08'
        notes: >-
          On 2026-10-04: a directory moved with its contents; moving a file
          onto itself returned 400 "Source and destination are the same"; a
          destination in /tmp and a body without `to` both returned 400
          "Invalid path". On 2026-10-08: invalid JSON body returned 422 with a
          ValidationError array.

