openapi: 3.0.3
info:
  title: Maritime Agents API
  version: 1.0.0
  description: |
    The Maritime REST API lets you create AI agents from templates, chat with
    them, run commands inside their sandboxed VMs, move files in and out of
    their persistent volumes, and trigger them from webhooks.

    This document covers the 18 core agent operations. It was built from the
    [public REST API docs](https://maritime.sh/docs/api) and the
    [auto-generated OpenAPI spec](https://api.maritime.sh/openapi.json), then
    checked against live calls on 2026-10-03, 2026-10-04, and 2026-10-08. Each
    operation carries an `x-verification` block recording what was confirmed live
    and what was taken from the docs without verification.

    ## Quickstart

    Get from an empty environment to a working AI agent in three curl commands:

    ### 1. Set your API key

    Generate an API key from the dashboard ([Settings → API keys](https://maritime.sh/settings)) or via `maritime keys create`, then export it in your shell:

    ```bash
    export MARITIME_API_KEY="mk_your_api_key_here"
    ```

    ### 2. Create an agent

    Deploy an agent from a ready-made template (such as `openclaw`):

    ```bash
    curl -s -X POST https://api.maritime.sh/api/agents \
      -H "Authorization: Bearer $MARITIME_API_KEY" \
      -H "Content-Type: application/json" \
      -d '{"name": "my-first-agent", "templateId": "openclaw"}'
    ```

    The response returns `201 Created` with `status: deploying`. Note the `id` from the response. The agent transitions to `active` in about 20–40 seconds.

    ### 3. Send a message

    Chat with your deployed agent:

    ```bash
    curl -s -X POST https://api.maritime.sh/api/agents/{agent_id}/chat \
      -H "Authorization: Bearer $MARITIME_API_KEY" \
      -H "Content-Type: application/json" \
      -d '{"message": "Hello! Introduce yourself."}'
    ```

    The call waits for the agent to finish its turn and returns `200 OK` with `{"response": "..."}`. Sleeping agents wake automatically upon receiving a message.

    ## Authentication

    Send a personal API key (prefix `mk_`) as a Bearer token:

    ```http
    Authorization: Bearer mk_xxxxxxxxxxxx
    ```

    You can generate an API key in two ways:
    - **Dashboard:** In [Settings → API keys](https://maritime.sh/settings), generate a key with default full access.
    - **CLI:** Run `maritime keys create` (requires the Maritime CLI installed and signed in via `maritime login`).

    ### Credentials and scope behavior

    - **Missing key (`403`):** Omitting the `Authorization` header returns `403 Forbidden` with `{"detail": "Not authenticated"}`. The key must use the `Bearer` scheme; sending the key raw without `Bearer` or in an `X-API-Key` header returns `403`.
    - **Invalid, expired, or revoked key (`401`):** An invalid token, an expired key, or a revoked key returns `401 Unauthorized` with `{"detail": "Invalid token"}`.
    - **Key scopes:** While keys can be minted with restricted scopes (`provision`, `deploy`, `secrets`, `manage`), restricted keys are designed for the `/api/v1` partner surface. Using a scoped key against the core agent REST API (`/api/agents/*`) returns `401 Invalid token`. Always use a full-access key for the core agent API.
    - **Public endpoints:** Public endpoints (`/health`, `/api/templates`, and `/api/webhooks/{agent_id}`) do not require authentication and ignore invalid tokens.

    ## Sleeping agents

    Agents sleep when idle. Chat, exec, logs, file operations, and webhook invokes wake a sleeping agent automatically, which adds about 1–3 seconds to the first call. You rarely need to start an agent yourself.

    ## Rate limits and thresholds

    The platform enforces operational thresholds across file sizes, command timeouts, and webhook requests:

    | Resource / Operation | Limit / Threshold | Behavior when exceeded |
    |---|---|---|
    | **Webhook invokes** (`POST /webhooks/{agent_id}`) | 30 calls per minute per agent & caller | Returns `429 Too Many Requests` with a `Retry-After` header in seconds. |
    | **REST API requests** (Agents, files, logs) | No fixed request-per-minute cap | Normal CRUD and polling operations are not aggressively rate-limited. |
    | **Concurrently awake machines** | Free: 1, Starter: 5, Growth: 25, Scale: 60 | Chatting with a sleeping agent at capacity returns `200 OK` with an advisory string explaining the limit; the agent remains asleep. File operations wake the machine directly. |
    | **Command execution timeout** (`POST /exec`) | Default 60s; maximum 120s | Timeouts above 120s are clamped. Commands that exceed the limit return `502 Exec failed`. |
    | **Command output buffer** (`POST /exec`) | 262,144 characters (256 KiB) | Excess output is truncated from the head; the trailing 256 KiB is retained with a `[output truncated]` marker. |
    | **File transfer size** (Upload & Download) | 100 MB per file | Uploads exceeding 100 MB are rejected. |
    | **Log entries pagination** (`GET /logs`) | Maximum 1000 entries per request | Passing `limit` > 1000 returns `422 Unprocessable Entity`. |

    ## Status and error codes

    Errors return JSON with a `detail` field. For most errors, `detail` is a human-readable string. For request validation failures on typed bodies and query parameters, `detail` is an array of validation issues (status `422`).

    | Status | Meaning | `detail` format | Example / Resolution |
    |---|---|---|---|
    | `400 Bad Request` | Hand-validated body failure (e.g., exec or file write/mkdir/move), path outside volume, or directory given to download | String | `{"detail": "Invalid path"}`. Verify parameters and volume boundaries. |
    | `401 Unauthorized` | Invalid, expired, revoked, or unsupported scoped API key | String | `{"detail": "Invalid token"}`. Check or re-issue your API key in dashboard settings. |
    | `402 Payment Required` | Plan agent seat limit reached | Object (`PlanLimitError`) | `{"detail": "...", "code": "seat_limit", "upgrade": true}`. Delete an unused agent or upgrade plan. |
    | `403 Forbidden` | Missing `Authorization` header or missing `Bearer` prefix | String | `{"detail": "Not authenticated"}`. Include `Authorization: Bearer mk_...`. |
    | `404 Not Found` | Agent not found, path not found on volume, or file empty on download | String | `{"detail": "Agent <id> not found"}`. Check the agent ID or container path. |
    | `405 Method Not Allowed` | Unsupported HTTP method on route | String (empty or text) | Check the `Allow` header and use the correct HTTP method. |
    | `409 Conflict` | Agent name already taken, or file move destination exists | String | `{"detail": "You already have an agent named..."}`. Choose a distinct name or destination. |
    | `422 Unprocessable Entity` | Schema validation error (missing/wrong field types) or invalid JSON | Array of issues | `{"detail": [{"loc": ["body", "name"], "msg": "Field required", ...}]}`. |
    | `429 Too Many Requests` | Webhook invoke rate limit exceeded (30 invokes/min) | String | `{"detail": "Rate limit exceeded: 30/min for public-webhook"}`. Back off according to `Retry-After`. |
    | `500 Internal Server Error` | Server-side write/mkdir failure (e.g. write to existing directory) | String | `{"detail": "Write failed"}`. Ensure target file/directory states do not conflict. |
    | `502 Bad Gateway` | Exec command timed out (max 120s) or failed to run in VM | String | `{"detail": "Exec failed"}`. Check container state or adjust timeout. |

    ### Global behaviors

    - **Method not allowed (`405`):** Unsupported methods return `405` with an `Allow` header (note that the header may list only a subset of valid methods, e.g. `PUT /api/agents` returns `Allow: GET` despite `POST` also being supported).
    - **Unknown query parameters and fields:** Extraneous query parameters and unknown JSON fields in request bodies are ignored.
    - **Browser access (CORS):** Direct browser API calls from external origins return `400 Disallowed CORS origin` on preflight, and normal responses carry no `Access-Control-Allow-Origin` header. Always call the API from a backend service.
  contact:
    name: Maritime documentation
    url: https://maritime.sh/docs/api
servers:
  - url: https://api.maritime.sh
    description: Production
security:
  - BearerAuth: []
tags:
  - name: Health
    description: Service status.
  - name: Templates
    description: The catalog of ready-made agents you can create from.
  - name: Agents
    description: Create, list, inspect and delete agents.
  - name: Interaction
    description: Talk to an agent, run commands in its VM, and read its logs.
  - name: Files
    description: |
      Move files in and out of an agent's sandbox. Browse, write, mkdir, move
      and delete are confined to the agent's persistent volume. The volume
      root depends on the template/framework: `/data` for `openclaw`,
      `codex`, and `dsh`; `/zeroclaw-data` for `zeroclaw`; `/opt/data` for
      `hermes`. Always read it from the `root` field of
      [List files](#operation/listAgentFiles) instead of hardcoding it. Paths
      outside the volume return `400 Invalid path`. Download accepts any
      absolute path in the container. Every file call wakes a sleeping agent.
      Transfers are capped at 100 MB per file.
  - name: Webhooks
    description: |
      Incoming webhooks: external services push data **into** Maritime, not the
      other way round. Every agent has an invoke URL
      (`/api/webhooks/{agent_id}`) that accepts arbitrary JSON and delivers it
      to the agent in the background, waking it first if it is asleep.

      Use this to connect third-party event sources — such as GitHub, Stripe,
      or your own backend — directly to an agent without building a relay
      server. Paste the agent's invoke URL (with its `wht_` token) into the
      external service's webhook settings, and Maritime receives the payloads
      for you.

      Authentication uses a per-agent invoke token (`wht_…`), not your
      personal `mk_` API key. Get the token from
      [Get the webhook token](#operation/getWebhookToken).
paths:
  /health:
    get:
      tags: [Health]
      summary: Check API health
      description: Returns `200` with `status` set to `ok` when the API is up. No authentication required.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                runtime: fleet
                event_loop:
                  n: 60
                  p50_ms: 0.0
                  p95_ms: 1.0
                  max_ms: 1.0
                  window_s: 60.0
                  at: 1791027653.3018737
                leader:
                  instance_id: 6247bb4c-9f44-4bde-9629-fe8c98b9250d
                  leader: true
                  standalone: false
                  term: 191
                  expires_at: '2026-10-03T11:42:15.178933+00:00'
                deploy_queue:
                  queued: 0
                  retry_wait: 0
                  claimed: 0
                  dead_letter: 0
                  stale_leases: 0
                  oldest_waiting_s: 0.0
                  at: '2026-10-03T11:40:52.317030+00:00'
      x-verification:
        status: verified
        date: '2026-10-03'

  /api/templates:
    get:
      tags: [Templates]
      summary: List templates
      description: |
        Returns every agent template you can create from. Pass a template's
        `id` as `templateId` when you [create an agent](#operation/createAgent).
        No authentication required.

        The `envRequired` array lists variables a template can use, but most
        templates work without setting them: Maritime's built-in LLM proxy
        handles model calls by default, billed against your account's
        [AI credits](https://maritime.sh/docs/billing#ai-credits). Set your
        own key (e.g. `OPENAI_API_KEY`) only if you want to pay your provider
        directly instead of using credits.

        The one exception is the **Claude Code** template, which always
        requires your own `ANTHROPIC_API_KEY` because the proxy speaks the
        OpenAI format, which Claude Code does not use.
      operationId: listTemplates
      security: []
      responses:
        '200':
          description: The template catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Template'
              example:
                - id: openclaw
                  name: OpenClaw Agent
                  framework: openclaw
                  image: ghcr.io/openclaw/openclaw:2026.7.1
                  description: Autonomous AI agent with 100+ skills.
                  tags: [Autonomous, Node.js]
                  envRequired: [OPENAI_API_KEY]
                  videoUrl: https://maritime.sh/videos/templates/openclaw.mp4
                  hidden: false
                - id: zeroclaw
                  name: ZeroClaw Agent
                  framework: zeroclaw
                  image: ghcr.io/zeroclaw-labs/zeroclaw:v0.8.5-debian
                  description: Ultra-lightweight Rust AI agent. <5MB RAM, instant startup.
                  tags: [Lightweight, Rust]
                  envRequired: []
                  videoUrl: https://maritime.sh/videos/templates/zeroclaw.mp4
                  hidden: false
                - id: claude_code
                  name: Claude Code
                  framework: custom
                  image: ghcr.io/maritime-sh/claude-code-agent:2026.8.11
                  description: 'Claude Code with its own computer: writes and runs code with real tools in a persistent workspace.'
                  tags: [Coding, Anthropic, Node.js]
                  envRequired: [ANTHROPIC_API_KEY]
                  videoUrl: null
                  hidden: false
      x-verification:
        status: verified
        date: '2026-10-03'
        notes: Six templates returned (openclaw, zeroclaw, hermes, claude_code, codex, dsh). Example trimmed to three.

  /api/agents:
    get:
      tags: [Agents]
      summary: List agents
      description: Returns all agents owned by the authenticated account as a bare JSON array (no pagination wrapper).
      operationId: listAgents
      responses:
        '200':
          description: The account's agents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agent'
              example:
                - id: 9984a8f4-1331-4ce6-91a0-11eae3fef000
                  name: OpenClaw Agent
                  description: null
                  instructions: null
                  externalId: null
                  framework: openclaw
                  tier: always_on
                  status: sleeping
                  githubRepo: null
                  autoPair: true
                  exposedPort: null
                  healthCheckPath: null
                  hasWebUi: true
                  templateId: openclaw
                  publicPlay: false
                  publicWeb: false
                  publicUrl: null
                  desktopEnabled: false
                  invocationCount: 1
                  totalComputeSeconds: 888
                  memMb: null
                  vcpus: null
                  idleTtlSeconds: null
                  diskMb: null
                  computeMinutesLimit: null
                  sleepPolicy: auto-sleep
                  lastStartedAt: null
                  lastActiveAt: '2026-09-27T10:34:58.974724+00:00'
                  derivedImageTag: null
                  browserbaseConfigured: false
                  projectId: c3374a3f-e70e-4103-8725-44c05540b402
                  projectRole: base
                  createdAt: '2026-09-27T10:29:43.338812+00:00'
                  updatedAt: '2026-09-27T10:44:38.877709+00:00'
        '401':
          $ref: '#/components/responses/InvalidKey'
        '403':
          $ref: '#/components/responses/MissingKey'
      x-verification:
        status: verified
        date: '2026-10-03'
    post:
      tags: [Agents]
      summary: Create an agent
      description: |
        Creates an agent and starts deploying it immediately. The response
        returns `201` with `status: deploying`; poll
        [Get an agent](#operation/getAgent) until `status` is `active` (about
        25 seconds for the `zeroclaw` template).

        Always pass `templateId` (see [List templates](#operation/listTemplates)).
        The template sets `framework` for you, so you don't need to send it.
        To deploy your own code instead, set `framework: custom` with either
        `githubRepo` (and optionally `branch`) or a public `imageName`.

        **`templateId` isn't checked.** An ID that matches no template still
        returns `201`, creating a `framework: custom` agent with nothing to
        run, and the agent takes up one of your plan's seats. Check the ID
        against the template list first.

        Names must be unique within your account (`409` otherwise). There's
        no practical length limit: a 278-character name was accepted.
      operationId: createAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCreate'
            examples:
              fromTemplate:
                summary: From a template
                value:
                  name: my-agent
                  templateId: zeroclaw
              fromImage:
                summary: From a public container image
                value:
                  name: my-container-agent
                  framework: custom
                  imageName: ghcr.io/acme/agent:1.4.0
      responses:
        '201':
          description: The agent was created and is deploying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
              example:
                id: e25829dd-175b-4be2-97b8-f0939bb9de9f
                name: oas-test-agent
                description: null
                instructions: null
                externalId: null
                framework: zeroclaw
                tier: always_on
                status: deploying
                githubRepo: null
                autoPair: true
                exposedPort: null
                healthCheckPath: null
                hasWebUi: true
                templateId: zeroclaw
                publicPlay: false
                publicWeb: false
                publicUrl: null
                desktopEnabled: false
                invocationCount: 0
                totalComputeSeconds: 0
                memMb: null
                vcpus: null
                idleTtlSeconds: null
                diskMb: null
                computeMinutesLimit: null
                sleepPolicy: auto-sleep
                lastStartedAt: null
                lastActiveAt: null
                derivedImageTag: null
                browserbaseConfigured: false
                projectId: 26845756-735e-434e-9be0-97c08d9ea976
                projectRole: base
                createdAt: '2026-10-03T11:42:18.286499Z'
                updatedAt: '2026-10-03T11:42:18.605124Z'
        '401':
          $ref: '#/components/responses/InvalidKey'
        '402':
          description: Your plan's agent limit is reached. Delete an agent or upgrade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanLimitError'
              example:
                detail: 'You are on the free plan, which includes 3 agents (you have 3). Delete an agent you no longer need, or upgrade to a paid plan to create more: https://maritime.sh/billing'
                code: seat_limit
                upgrade: true
        '403':
          $ref: '#/components/responses/MissingKey'
        '409':
          description: You already have an agent with this name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: You already have an agent named "my-agent". Please choose a different name.
        '422':
          $ref: '#/components/responses/ValidationFailed'
      x-verification:
        status: partial
        date: '2026-10-08'
        notes: >-
          Verified with {name, templateId}. Observed status sequence was
          deploying -> active. On 2026-10-04: a duplicate name returned 409; a
          fourth agent on the free plan returned 402 with code seat_limit; an
          unknown templateId returned 201 and created a framework=custom
          agent; a 278-character name was accepted; {} returned 422 for name
          only (templateId is optional); a non-string templateId, a
          form-encoded body and invalid JSON each returned 422. On 2026-10-08:
          missing Authorization header returned 403; invalid key returned 401.
          The custom-image and GitHub-repo variants were not exercised.

  /api/agents/{agent_id}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Agents]
      summary: Get an agent
      description: Returns one agent. Poll this after creating an agent to see when `status` becomes `active`.
      operationId: getAgent
      responses:
        '200':
          description: The agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
              example:
                id: e25829dd-175b-4be2-97b8-f0939bb9de9f
                name: oas-test-agent
                description: null
                instructions: null
                externalId: null
                framework: zeroclaw
                tier: always_on
                status: active
                githubRepo: null
                autoPair: true
                exposedPort: null
                healthCheckPath: null
                hasWebUi: true
                templateId: zeroclaw
                publicPlay: false
                publicWeb: false
                publicUrl: null
                desktopEnabled: false
                invocationCount: 0
                totalComputeSeconds: 232
                memMb: null
                vcpus: null
                idleTtlSeconds: null
                diskMb: null
                computeMinutesLimit: null
                sleepPolicy: auto-sleep
                lastStartedAt: null
                lastActiveAt: '2026-10-03T11:42:36.764976Z'
                derivedImageTag: null
                browserbaseConfigured: false
                projectId: 26845756-735e-434e-9be0-97c08d9ea976
                projectRole: base
                createdAt: '2026-10-03T11:42:18.286499Z'
                updatedAt: '2026-10-03T11:42:47.601322Z'
        '401':
          $ref: '#/components/responses/InvalidKey'
        '403':
          $ref: '#/components/responses/MissingKey'
        '404':
          $ref: '#/components/responses/AgentNotFound'
      x-verification:
        status: verified
        date: '2026-10-04'
        notes: >-
          A malformed (non-UUID) ID also returns 404, not 422. The record has
          the same fields while deploying, active and sleeping; only status
          and the counters change.
    delete:
      tags: [Agents]
      summary: Delete an agent
      description: |
        Permanently deletes the agent, its container and its data volume.
        This cannot be undone. Returns `204` with an empty body. Deleting an
        agent that no longer exists returns `404`. An agent can be deleted
        while it is still `deploying`.
      operationId: deleteAgent
      responses:
        '204':
          description: The agent was deleted.
        '401':
          $ref: '#/components/responses/InvalidKey'
        '403':
          $ref: '#/components/responses/MissingKey'
        '404':
          $ref: '#/components/responses/AgentNotFound'
      x-verification:
        status: verified
        date: '2026-10-04'
        notes: >-
          Deleting an agent 0.5 s after creating it, while its status was
          deploying, returned 204, and a GET then returned 404.

  /api/agents/{agent_id}/chat:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [Interaction]
      summary: Chat with an agent
      description: |
        Sends a message to the agent and waits for its reply. Messages take
        the same delivery path as Telegram and webhooks. A sleeping agent
        wakes automatically, so the first call after a sleep takes longer.

        Replies typically take a few seconds. Custom-container agents must
        answer within 30 seconds.

        An empty `message` isn't rejected; the agent receives it and replies.

        If an agent template lacks a model key Maritime cannot proxy (for example
        Claude Code without `ANTHROPIC_API_KEY`), the endpoint still returns
        `200 OK` with an advisory message in `response` explaining that the
        key is missing.

        Similarly, if the account has reached its plan limit for concurrently awake
        machines (such as 1 machine on the Free plan), chatting with a sleeping agent
        does not return `429`; it returns `200 OK` within ~0.5 seconds with an advisory
        message in `response` stating that the agent cannot be woken, and the agent
        remains asleep.
      operationId: chatWithAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
            example:
              message: summarize today
      responses:
        '200':
          description: The agent's reply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
              examples:
                standard:
                  summary: Normal agent reply
                  value:
                    response: hello from oas test
                wakeLimitReached:
                  summary: Concurrently awake machines limit reached
                  value:
                    response: "This agent can't be woken right now: You have 1 machines awake. Your plan permits 1. Sleep a machine, or upgrade your plan: https://maritime.sh/billing"
        '401':
          $ref: '#/components/responses/InvalidKey'
        '403':
          $ref: '#/components/responses/MissingKey'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      x-verification:
        status: verified
        date: '2026-10-08'
        notes: >-
          Request/response shape, 404 and 422 verified (about 2-4 s per reply).
          An empty message, unicode and emoji, and unknown extra fields were
          accepted; a numeric conversation_id returned 422. Chatting with a
          sleeping agent woke it and replied in 3.5 s. conversation_id was
          accepted, but on a zeroclaw agent a second message in the same
          conversation did not recall the first; continuity appears to be
          framework-dependent. On 2026-10-04: chat without custom model
          credentials was verified on openclaw (replied via Maritime LLM proxy).
          On 2026-10-08: chatting with a sleeping agent while another machine was
          active on the Free plan returned 200 OK in 0.56s with an advisory
          response string rather than 429, and the sleeping agent remained asleep.
          in 9.3 s) and claude_code (returned 200 in 1.0 s with an advisory
          string noting missing ANTHROPIC_API_KEY). The response does not echo
          a conversation ID.

  /api/agents/{agent_id}/exec:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [Interaction]
      summary: Run a command
      description: |
        Runs a one-shot, non-interactive shell command in the agent's VM and
        returns its exit code and output. Wakes a sleeping agent.

        - `command` is either an argv array (each token is quoted for you) or a
          raw shell string.
        - stdout and stderr are merged into one stream, returned in `stdout`;
          `stderr` is currently always empty.
        - Output is capped at 256 KiB (262,144 bytes). Longer output keeps
          the **last** 256 KiB, prefixed with `[output truncated]\n`.
        - A non-zero exit code still returns `200`; check `exitCode`. A
          command that doesn't exist returns `200` with exit code `127`.
        - If the command exceeds `timeout`, the call returns
          `502 Exec failed`. Timeouts above 120 s are accepted but clamped to
          120 s.
        - Commands run as `root`, with `/` as the working directory and
          `$HOME`.
      operationId: execInAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecRequest'
            examples:
              argv:
                summary: Argv tokens
                value:
                  command: [ls, -la, /data]
                  timeout: 30
              shell:
                summary: Raw shell string
                value:
                  command: 'grep -c ERROR /data/app.log || true'
      responses:
        '200':
          description: The command ran (whatever its exit code).
          content:
            application/json:
