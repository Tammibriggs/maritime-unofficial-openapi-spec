  /api/agents/{agent_id}/logs:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Interaction]
      summary: Get agent logs
      description: |
        Returns the agent's log entries in reverse chronological order (newest
        first). To page back through older entries, pass the `timestamp` of the
        last received entry as `before`.
      operationId: getAgentLogs
      parameters:
        - name: limit
          in: query
          description: Maximum number of entries to return. Passing `0` returns an empty array.
          schema:
            type: integer
            minimum: 0
            maximum: 1000
            default: 100
          example: 100
        - name: level
          in: query
          description: Filters entries by log level. Matching is case-insensitive (for example, `INFO` matches `info`).
          schema:
            type: string
            enum: [debug, info, warn, error]
          example: error
        - name: before
          in: query
          description: Filters entries strictly older than this ISO 8601 timestamp. Use this parameter as a pagination cursor.
          schema:
            type: string
            format: date-time
          example: '2026-10-03T11:42:40Z'
      responses:
        '200':
          description: Log entries sorted in descending order by timestamp (newest first). Returns an empty array if no entries match.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogEntry'
              example:
                - id: 565a8d18-4294-4e4d-a5b5-97606e54b6a5
                  agentId: e25829dd-175b-4be2-97b8-f0939bb9de9f
                  level: info
                  message: Webhook received with 1 keys
                  timestamp: '2026-10-03T11:50:10.623090Z'
                  source: webhook
                - id: 6b019e54-9efb-496e-be3a-7fee530a7f47
                  agentId: e25829dd-175b-4be2-97b8-f0939bb9de9f
                  level: info
                  message: Agent deployed and running
                  timestamp: '2026-10-03T11:42:47.577748Z'
                  source: system
        '401':
          $ref: '#/components/responses/InvalidKey'
        '403':
          $ref: '#/components/responses/MissingKey'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '422':
          description: '`limit` is out of range or not a number, `before` is not a date-time, or `level` is not a known level.'
          content:
            application/json:
              schema:
                anyOf: 
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'
              examples:
                badLevel:
                  summary: Unknown level (string detail)
                  value:
                    detail: "Unknown log level 'bogus'; expected one of ['debug', 'error', 'info', 'warn']"
                badLimit:
                  summary: Limit greater than 1000 (validation array)
                  value:
                    detail:
                      - type: less_than_equal
                        loc: [query, limit]
                        msg: Input should be less than or equal to 1000
                        input: '5000'
                        ctx:
                          le: 1000
      x-verification:
        status: verified
        date: '2026-10-04'
        notes: >-
          On 2026-10-04: limit 0 returned 200 with an empty array; limit 1 and
          1000 returned 200; limit=abc and before=yesterday returned 422
          arrays; level=INFO passed validation and returned info entries. The
          docs page's example (limit=100&level=error) returned 200.

  /api/agents/{agent_id}/files/list:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Files]
      summary: List files
      description: |
        Lists a directory in the agent's persistent volume. If `path` is
        omitted, the endpoint lists the volume root. The response's `root`
        field indicates where the volume is mounted for this agent's framework
        (for example, `/data` for `openclaw`, `codex`, and `dsh`;
        `/zeroclaw-data` for `zeroclaw`; or `/opt/data` for `hermes`).

        Entries include dotfiles, and non-ASCII names are returned as-is.
        Directories appear first, followed by files, each sorted by name. If
        `path` points to a file, the API returns `404 Not Found` with
        `Not a directory`.
      operationId: listAgentFiles
      parameters:
        - name: path
          in: query
          description: Absolute path of the directory to list. Must be inside the volume. Defaults to the volume root.
          schema:
            type: string
          example: /zeroclaw-data
      responses:
        '200':
          description: The directory listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileListing'
              example:
                path: /zeroclaw-data
                root: /zeroclaw-data
                entries:
                  - name: .zeroclaw
                    isDir: true
                    size: 4096
                    mtime: 1791027942
                  - name: workspace
                    isDir: true
                    size: 4096
                    mtime: 1791028078
        '400':
          $ref: '#/components/responses/InvalidPath'
        '401':
          $ref: '#/components/responses/InvalidKey'
        '403':
          $ref: '#/components/responses/MissingKey'
        '404':
          description: The path doesn't exist, isn't a directory, or the agent wasn't found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Not a directory
      x-verification:
        status: verified
        date: '2026-10-05'
        notes: >-
          Volume roots were verified across templates on October 4 and 5, 2026:
          /data for openclaw, codex, and dsh; /zeroclaw-data for zeroclaw;
          /opt/data for hermes. The documentation example path /data returned 400
          on a zeroclaw agent and would fail on hermes, but succeeds on openclaw,
          codex, and dsh. A call against a sleeping agent woke it (2.7 seconds
          on 2026-10-03, 2.2 seconds on 2026-10-04). On 2026-10-04: a ../ path
          returned 400; a file path returned 404 "Not a directory"; a .hidden
          file and a "cafe-notes.md" file were both listed, after the directories.

  /api/agents/{agent_id}/files/download:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Files]
      summary: Download a file
      description: |
        Streams a file from the agent's container as an attachment. Unlike other
        file endpoints, `path` can be any absolute path in the container (not
        only within the volume), because agents can also write to `/tmp` and
        workspace directories. The `Content-Type` header is inferred from the
        file extension.

        Specifying a directory returns `400 Bad Request`. **An empty
        (zero-byte) file returns `404 Not Found` with `File not found`**, even
        though List files reports `size: 0`.
      operationId: downloadAgentFile
      parameters:
        - name: path
          in: query
          required: true
          description: Absolute path of the file in the container.
          schema:
            type: string
          example: /zeroclaw-data/oas/inbox/report.csv
      responses:
        '200':
          description: The file contents.
          headers:
            Content-Disposition:
              description: |
                Always `attachment`, with the file's base name. For a non-ASCII
                name, `filename` is an ASCII fallback with those characters
                dropped, and `filename*` carries the full UTF-8 name, for
                example `attachment; filename="caf notes.md";
                filename*=UTF-8''caf%C3%A9%20notes.md`.
              schema:
                type: string
              example: attachment; filename="report.csv"
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '400':
          description: The specified path is a directory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: path is a directory
        '401':
          $ref: '#/components/responses/InvalidKey'
        '403':
          $ref: '#/components/responses/MissingKey'
        '404':
          description: The file doesn't exist, is empty, or the agent wasn't found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: File not found
        '422':
          $ref: '#/components/responses/ValidationFailed'
      x-verification:
        status: verified
        date: '2026-10-04'
        notes: >-
          Downloaded a file from the volume (served as text/csv) and from /tmp
          (text/plain). On 2026-10-04: a directory returned 400 "path is a
          directory"; a zero-byte file written with write returned 404 "File
          not found"; a file named "cafe-notes.md" downloaded with the
          filename* header described in the response and Content-Type text/markdown. The
          docs page's example path /data/report.pdf returned 404. The 100 MB
          cap was not tested.

  /api/agents/{agent_id}/files/upload:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [Files]
      summary: Upload a file
      description: |
        Uploads a file (up to 100 MB) into the agent's container. The endpoint
        supports two modes:

        - **To a directory:** Provide `dest_dir`. The file is saved to that
          directory using its base name (for example, `../extra.csv` is saved as
          `extra.csv`). If the destination directory doesn't exist, it is
          created automatically. An existing file with the same name is
          overwritten without warning. If you also include `message`, the file
          is still saved to `dest_dir`.
        - **As a chat attachment:** Omit `dest_dir`. The file is saved to the
          agent's inbox with a Unix timestamp prefix added to the filename
          (`<volume>/workspace/inbox/<timestamp>-<filename>`), and the agent is
          notified in its active conversation. Include `message` to send
          accompanying text.

        Uploaded files are never executed.
      operationId: uploadAgentFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadRequest'
            encoding:
              file:
                contentType: application/octet-stream
      responses:
        '200':
          description: The file was uploaded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
              examples:
                toDirectory:
                  summary: With dest_dir
                  value:
                    ok: true
                    path: /zeroclaw-data/oas/inbox/report.csv
                    name: report.csv
                    size: 24
                asAttachment:
                  summary: Without dest_dir (chat attachment)
                  value:
                    ok: true
                    path: /zeroclaw-data/workspace/inbox/1791028078-report.csv
                    name: report.csv
                    size: 24
        '400':
          description: '`dest_dir` is outside the agent''s volume.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Invalid destination
        '401':
          $ref: '#/components/responses/InvalidKey'
        '403':
          $ref: '#/components/responses/MissingKey'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      x-verification:
        status: partial
        date: '2026-10-04'
        notes: >-
          Both modes, silent overwrite, and the 422 for a missing file part were
          verified. On 2026-10-04: dest_dir /tmp and the docs page's example
          /data/inbox both returned 400 "Invalid destination" (note: not
          "Invalid path"); a dest_dir that didn't exist was created; the
          filename ../evil.csv was saved as evil.csv; a zero-byte file was
          accepted (size 0); dest_dir plus message saved to dest_dir. The
          100 MB cap was not tested.

