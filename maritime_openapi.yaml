openapi: 3.0.3
info:
  title: Maritime Agents API
  version: 1.0.0
  description: |
    The Maritime REST API lets you create AI agents from templates, chat with
    them, run commands inside their sandboxed virtual machines (VMs), move
    files in and out of their persistent volumes, and trigger them from
    webhooks.

    New to Maritime? Follow the [Quickstart Guide](quickstart.html) to go from
    an empty environment to a working AI agent in three steps.

    This document covers the 18 core agent operations. It's based on the
    [Maritime REST API documentation](https://maritime.sh/docs/api) and the
    [Maritime OpenAPI specification](https://api.maritime.sh/openapi.json), and
    was checked against live calls on October 3, 4, 8, and 10, 2026. Each
    operation has an `x-verification` block that records what was confirmed
    live and what was taken from the docs without verification.

  contact:
    name: Maritime documentation
    url: https://maritime.sh/docs/api
servers:
  - url: https://api.maritime.sh
    description: Production
security:
  - BearerAuth: []
tags:
  - name: Authentication
    description: |
      Send your personal API key as a bearer token in the `Authorization` header:

      ```http
      Authorization: Bearer API_KEY
      ```

      Replace `API_KEY` with your API key, which starts with `mk_`.

      You can generate an API key in two ways:
      - **Dashboard:** Go to [Maritime dashboard settings](https://maritime.sh/settings) and generate a key in the **API keys** section. Keys generated here have full access by default.
      - **CLI:** If you have the Maritime CLI installed and are signed in with `maritime login`, run `maritime keys create`.

      ### Credentials and scope behavior

      - **Missing key (`403`):** Omitting the `Authorization` header returns `403 Forbidden` with `{"detail": "Not authenticated"}`. The key must use the `Bearer` scheme; sending the key without `Bearer`, or in an `X-API-Key` header, returns `403`.
      - **Invalid, expired, or revoked key (`401`):** An invalid token, an expired key, or a revoked key returns `401 Unauthorized` with `{"detail": "Invalid token"}`.
      - **Key scopes:** You can create keys with specific scopes (`provision`, `deploy`, `secrets`, and `manage`). If a key lacks the scope required for an operation (for example, `provision` on agent create, `deploy` on chat or file transfers, or `manage` on delete), the API returns `403 Forbidden` with `{"detail": "This API key lacks the '<scope>' scope required for this action."}`. Keys bound to a specific `project_id` are restricted to partner endpoints and return `403` on core routes.
      - **Public endpoints:** Public endpoints (`/health`, `/api/templates`, and `/api/webhooks/{agent_id}`) don't require authentication and ignore invalid tokens.

  - name: Rate Limits
    description: |
      ### Sleeping agents

      Agents sleep when idle. Chat, command, log, file, and webhook requests wake a sleeping agent automatically, which adds about 1 to 3 seconds to the first call. You rarely need to start an agent yourself.

      ### Rate limits and thresholds

      Maritime enforces the following limits on webhook calls, awake machines, commands, file transfers, and log queries:

      | Resource or operation | Limit | Behavior when exceeded |
      |---|---|---|
      | **Webhook calls** (`POST /api/webhooks/{agent_id}`) | 30 calls per minute for each agent and caller | Returns `429 Too Many Requests` with a `Retry-After` header that gives the wait time in seconds. |
      | **REST API requests** (agents, files, and logs) | No fixed requests-per-minute limit | Normal create, read, update, delete, and polling requests aren't aggressively rate-limited. |
      | **Concurrently awake machines** | Free: 1, Starter: 5, Growth: 25, Scale: 60 | Chatting with a sleeping agent at capacity returns `200 OK` with an advisory string that explains the limit, and the agent stays asleep. File operations wake the machine directly. |
      | **Command timeout** (`POST /api/agents/{agent_id}/exec`) | Default 60 seconds; maximum 120 seconds | Values greater than 120 are clamped to 120 seconds. Commands that run longer than the timeout return `502` with `Exec failed`. |
      | **Command output** (`POST /api/agents/{agent_id}/exec`) | 262,144 bytes (256 KiB) | The API drops the start of the output and keeps the last 256 KiB, prefixed with `[output truncated]`. |
      | **File transfer size** (upload and download) | 100 MB per file | Uploads larger than 100 MB are rejected. |
      | **Log entries per request** (`GET /api/agents/{agent_id}/logs`) | 1,000 entries | A `limit` greater than 1,000 returns `422 Unprocessable Entity`. |

  - name: Errors
    description: |
      ### Status and error codes

      Errors return JSON with a `detail` field. For most errors, `detail` is a human-readable string. For request validation failures on typed bodies and query parameters, `detail` is an array of validation issues (status `422`).

      | Status | Meaning | `detail` format | Example and resolution |
      |---|---|---|---|
      | `400 Bad Request` | Invalid body for exec or for the file write, mkdir, or move endpoints; a path outside the volume; or a directory passed to download | String | `{"detail": "Invalid path"}`. Check the request parameters and make sure the path is inside the volume. |
      | `401 Unauthorized` | Invalid, expired, or revoked API key | String | `{"detail": "Invalid token"}`. Check your API key, or generate a new one in the dashboard settings. |
      | `402 Payment Required` | Your plan's agent limit is reached | Object (`PlanLimitError`) | `{"detail": "...", "code": "seat_limit", "upgrade": true}`. Delete an unused agent or upgrade your plan. |
      | `403 Forbidden` | Missing `Authorization` header, missing `Bearer` prefix, insufficient key scope, or project boundary violation | String | `{"detail": "Not authenticated"}` or `{"detail": "This API key lacks the '<scope>' scope required for this action."}`. |
      | `404 Not Found` | Agent not found, path not found on the volume, or downloaded file is empty | String | `{"detail": "Agent AGENT_ID not found"}`. Check the agent ID or container path. |
      | `405 Method Not Allowed` | Unsupported HTTP method on the route | String (empty or text) | Check the `Allow` header and use the correct HTTP method. |
      | `409 Conflict` | Agent name already taken, or the destination of a file move already exists | String | `{"detail": "You already have an agent named..."}`. Choose a different name or destination. |
      | `422 Unprocessable Entity` | Schema validation error (missing fields or wrong field types) or invalid JSON | Array of issues | `{"detail": [{"loc": ["body", "name"], "msg": "Field required", ...}]}`. |
      | `429 Too Many Requests` | Webhook rate limit exceeded (30 calls per minute) | String | `{"detail": "Rate limit exceeded: 30/min for public-webhook"}`. Wait the number of seconds in `Retry-After`, and then retry. |
      | `500 Internal Server Error` | Server-side write or mkdir failure (for example, writing to an existing directory) | String | `{"detail": "Write failed"}`. Make sure that the target path isn't an existing directory (for write) or an existing file (for mkdir). |
      | `502 Bad Gateway` | Command timed out (maximum 120 seconds) or couldn't run in the VM | String | `{"detail": "Exec failed"}`. Check the agent's status, or increase `timeout`. |

      ### Global behaviors

      - **Method not allowed (`405`):** Unsupported methods return `405` with an `Allow` header. The header might list only some of the valid methods. For example, `PUT /api/agents` returns `Allow: GET`, even though `POST` is also supported.
      - **Unknown query parameters and fields:** Extra query parameters and unknown JSON fields in request bodies are ignored.
      - **Browser access (CORS):** Direct browser calls from external origins return `400 Disallowed CORS origin` on the cross-origin resource sharing (CORS) preflight, and normal responses have no `Access-Control-Allow-Origin` header. Call the API from a backend service instead.

  - name: Health
    description: Service status.
  - name: Templates
    description: The catalog of ready-made agents you can create from.
  - name: Agents
    description: Create, list, inspect, and delete agents.
  - name: Interaction
    description: Talk to an agent, run commands in its VM, and read its logs.
  - name: Files
    description: |
      Move files in and out of an agent's sandbox. Listing, writing, creating
      directories, moving, and deleting are limited to the agent's persistent
      volume. The volume root depends on the template: `/data` for
      `openclaw`, `codex`, and `dsh`; `/zeroclaw-data` for `zeroclaw`; and
      `/opt/data` for `hermes`. Don't hardcode the root; read it from the
      `root` field returned by [List files](#operation/listAgentFiles). Paths
      outside the volume return `400 Invalid path`. Download accepts any
      absolute path in the container. Every file request wakes a sleeping
      agent. Transfers are limited to 100 MB per file.

      The examples come from a `zeroclaw` agent, so their paths start with
      `/zeroclaw-data`.
  - name: Webhooks
    description: |
      These are incoming webhooks: external services send data **to**
      Maritime, not the other way around. Every agent has an invoke URL
      (`/api/webhooks/{agent_id}`) that accepts arbitrary JSON and delivers it
      to the agent in the background, waking the agent first if it's asleep.

      Use webhooks to connect third-party event sources—such as GitHub,
      Stripe, or your own backend—directly to an agent without building a
      relay server. Paste the agent's invoke URL (with its `wht_` token) into
      the external service's webhook settings, and Maritime receives the
      payloads for you.

      Webhooks authenticate with a per-agent invoke token (`wht_…`), not your
      personal `mk_` API key. To get the token, see
      [Get the webhook token](#operation/getWebhookToken).
paths:
  /health:
    get:
      tags: [Health]
      summary: Check API health
      description: Returns `200 OK` with `status` set to `ok` when the API is operational. Authentication isn't required.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: The API is operational.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                runtime: fleet
                event_loop:
                  n: 60
                  p50_ms: 0.0
                  p95_ms: 1.0
                  max_ms: 1.0
                  window_s: 60.0
                  at: 1791027653.3018737
                leader:
                  instance_id: 6247bb4c-9f44-4bde-9629-fe8c98b9250d
                  leader: true
                  standalone: false
                  term: 191
                  expires_at: '2026-10-03T11:42:15.178933+00:00'
                deploy_queue:
                  queued: 0
                  retry_wait: 0
                  claimed: 0
                  dead_letter: 0
                  stale_leases: 0
                  oldest_waiting_s: 0.0
                  at: '2026-10-03T11:40:52.317030+00:00'
      x-verification:
        status: verified
        date: '2026-10-03'

  /api/templates:
    get:
      tags: [Templates]
      summary: List templates
      description: |
        Returns all templates that you can use to create an agent. Pass a
        template's `id` value as `templateId` when calling
        [Create an agent](#operation/createAgent). Authentication isn't
        required.

        The `envRequired` array lists variables that a template can use, but
        most templates work without them. Maritime's built-in proxy handles
        model calls by default, billed to your account's
        [AI credits billing](https://maritime.sh/docs/billing#ai-credits).
        Set your own key (for example, `OPENAI_API_KEY`) only if you want to
        pay your provider directly instead of using credits.

        The one exception is the **Claude Code** template, which always
        requires your own `ANTHROPIC_API_KEY` because the proxy uses the
        OpenAI format, which Claude Code does not use.
      operationId: listTemplates
      security: []
      responses:
        '200':
          description: A list of available agent templates.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Template'
              example:
                - id: openclaw
                  name: OpenClaw Agent
                  framework: openclaw
                  image: ghcr.io/openclaw/openclaw:2026.7.1
                  description: Autonomous AI agent with 100+ skills.
                  tags: [Autonomous, Node.js]
                  envRequired: [OPENAI_API_KEY]
                  videoUrl: https://maritime.sh/videos/templates/openclaw.mp4
                  hidden: false
                - id: zeroclaw
                  name: ZeroClaw Agent
                  framework: zeroclaw
                  image: ghcr.io/zeroclaw-labs/zeroclaw:v0.8.5-debian
                  description: Ultra-lightweight Rust AI agent. <5MB RAM, instant startup.
                  tags: [Lightweight, Rust]
                  envRequired: []
                  videoUrl: https://maritime.sh/videos/templates/zeroclaw.mp4
                  hidden: false
                - id: claude_code
                  name: Claude Code
                  framework: custom
                  image: ghcr.io/maritime-sh/claude-code-agent:2026.8.11
                  description: 'Claude Code with its own computer: writes and runs code with real tools in a persistent workspace.'
                  tags: [Coding, Anthropic, Node.js]
                  envRequired: [ANTHROPIC_API_KEY]
                  videoUrl: null
                  hidden: false
      x-verification:
        status: verified
        date: '2026-10-03'
        notes: Six templates returned (openclaw, zeroclaw, hermes, claude_code, codex, dsh). Example trimmed to three.

  /api/agents:
    get:
      tags: [Agents]
      summary: List agents
      description: Returns all agents owned by the authenticated account as a JSON array without pagination.
      operationId: listAgents
      responses:
        '200':
          description: A list of agents owned by the authenticated account.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agent'
              example:
                - id: 9984a8f4-1331-4ce6-91a0-11eae3fef000
                  name: OpenClaw Agent
                  description: null
                  instructions: null
                  externalId: null
                  framework: openclaw
                  tier: always_on
                  status: sleeping
                  githubRepo: null
                  autoPair: true
                  exposedPort: null
                  healthCheckPath: null
                  hasWebUi: true
                  templateId: openclaw
                  publicPlay: false
                  publicWeb: false
                  publicUrl: null
                  desktopEnabled: false
                  invocationCount: 1
                  totalComputeSeconds: 888
                  memMb: null
                  vcpus: null
                  idleTtlSeconds: null
                  diskMb: null
                  computeMinutesLimit: null
                  sleepPolicy: auto-sleep
                  lastStartedAt: null
                  lastActiveAt: '2026-09-27T10:34:58.974724+00:00'
                  derivedImageTag: null
                  browserbaseConfigured: false
                  projectId: c3374a3f-e70e-4103-8725-44c05540b402
                  projectRole: base
                  createdAt: '2026-09-27T10:29:43.338812+00:00'
                  updatedAt: '2026-09-27T10:44:38.877709+00:00'
        '401':
          $ref: '#/components/responses/InvalidKey'
        '403':
          $ref: '#/components/responses/MissingKey'
      x-verification:
        status: verified
        date: '2026-10-03'
    post:
      tags: [Agents]
      summary: Create an agent
      description: |
        Creates an agent and starts deployment immediately. The response
        returns `201 Created` with `status: deploying`. Poll
        [Get an agent](#operation/getAgent) until `status` is `active` (about
        25 seconds for the `zeroclaw` template).

        When creating an agent from a template, pass `templateId` (see
        [List templates](#operation/listTemplates)) and omit `framework`; the
        platform configures the framework automatically based on the template.
        To deploy your own code instead, set `framework` to `custom` along with
        either `githubRepo` (and optionally `branch`) or a public `imageName`.

        Check the template list first before specifying an ID. An ID that
        matches no template still returns `201 Created`, which creates a
        `framework: custom` agent with nothing to run and consumes one of your
        plan's agent seats.

        Names must be unique within your account; duplicate names return
        `409 Conflict`. There is no practical length limit; names up to
        278 characters are accepted.
      operationId: createAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCreate'
            examples:
              fromTemplate:
                summary: From a template
                value:
                  name: my-agent
                  templateId: zeroclaw
              fromImage:
                summary: From a public container image
                value:
                  name: my-container-agent
                  framework: custom
                  imageName: ghcr.io/acme/agent:1.4.0
      responses:
        '201':
          description: The agent was created and is deploying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
              example:
                id: e25829dd-175b-4be2-97b8-f0939bb9de9f
                name: oas-test-agent
                description: null
                instructions: null
                externalId: null
                framework: zeroclaw
                tier: always_on
                status: deploying
                githubRepo: null
                autoPair: true
                exposedPort: null
                healthCheckPath: null
                hasWebUi: true
                templateId: zeroclaw
                publicPlay: false
                publicWeb: false
                publicUrl: null
                desktopEnabled: false
                invocationCount: 0
                totalComputeSeconds: 0
                memMb: null
                vcpus: null
                idleTtlSeconds: null
                diskMb: null
                computeMinutesLimit: null
                sleepPolicy: auto-sleep
                lastStartedAt: null
                lastActiveAt: null
                derivedImageTag: null
                browserbaseConfigured: false
                projectId: 26845756-735e-434e-9be0-97c08d9ea976
                projectRole: base
                createdAt: '2026-10-03T11:42:18.286499Z'
                updatedAt: '2026-10-03T11:42:18.605124Z'
        '401':
          $ref: '#/components/responses/InvalidKey'
        '402':
          description: Your plan's agent limit has been reached. Delete an unused agent or upgrade your plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanLimitError'
              example:
                detail: 'You are on the free plan, which includes 3 agents (you have 3). Delete an agent you no longer need, or upgrade to a paid plan to create more: https://maritime.sh/billing'
                code: seat_limit
                upgrade: true
        '403':
          $ref: '#/components/responses/MissingKey'
        '409':
          description: An agent with this name already exists in your account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: You already have an agent named "my-agent". Please choose a different name.
        '422':
          $ref: '#/components/responses/ValidationFailed'
      x-verification:
        status: partial
        date: '2026-10-08'
        notes: >-
          Verified with {name, templateId}. Observed status sequence was
          deploying -> active. On 2026-10-04: a duplicate name returned 409; a
          fourth agent on the free plan returned 402 with code seat_limit; an
          unknown templateId returned 201 and created a framework=custom
          agent; a 278-character name was accepted; {} returned 422 for name
          only (templateId is optional); a non-string templateId, a
          form-encoded body and invalid JSON each returned 422. On 2026-10-08:
          missing Authorization header returned 403; invalid key returned 401.
          The custom-image and GitHub repository variants were not exercised.

  /api/agents/{agent_id}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Agents]
      summary: Get an agent
      description: Returns an agent by ID. After creating an agent, poll this endpoint to determine when `status` becomes `active`.
      operationId: getAgent
      responses:
        '200':
          description: The agent details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
              example:
                id: e25829dd-175b-4be2-97b8-f0939bb9de9f
                name: oas-test-agent
                description: null
                instructions: null
                externalId: null
                framework: zeroclaw
                tier: always_on
                status: active
                githubRepo: null
                autoPair: true
                exposedPort: null
                healthCheckPath: null
                hasWebUi: true
                templateId: zeroclaw
                publicPlay: false
                publicWeb: false
                publicUrl: null
                desktopEnabled: false
                invocationCount: 0
                totalComputeSeconds: 232
                memMb: null
                vcpus: null
                idleTtlSeconds: null
                diskMb: null
                computeMinutesLimit: null
                sleepPolicy: auto-sleep
                lastStartedAt: null
                lastActiveAt: '2026-10-03T11:42:36.764976Z'
                derivedImageTag: null
                browserbaseConfigured: false
                projectId: 26845756-735e-434e-9be0-97c08d9ea976
                projectRole: base
                createdAt: '2026-10-03T11:42:18.286499Z'
                updatedAt: '2026-10-03T11:42:47.601322Z'
        '401':
          $ref: '#/components/responses/InvalidKey'
        '403':
          $ref: '#/components/responses/MissingKey'
        '404':
          $ref: '#/components/responses/AgentNotFound'
      x-verification:
        status: verified
        date: '2026-10-04'
        notes: >-
          A malformed (non-UUID) ID also returns 404, not 422. The record has
          the same fields while deploying, active and sleeping; only status
          and the counters change.
    delete:
      tags: [Agents]
      summary: Delete an agent
      description: |
        Permanently deletes the agent, its container, and its persistent
        volume. This action can't be undone. Returns `204 No Content` with an
        empty response body. Deleting an agent that no longer exists returns
        `404 Not Found`. You can delete an agent while it is still `deploying`.
      operationId: deleteAgent
      responses:
        '204':
          description: The agent was deleted successfully.
        '401':
          $ref: '#/components/responses/InvalidKey'
        '403':
          $ref: '#/components/responses/MissingKey'
        '404':
          $ref: '#/components/responses/AgentNotFound'
      x-verification:
        status: verified
        date: '2026-10-04'
        notes: >-
          Deleting an agent 0.5 s after creating it, while its status was
          deploying, returned 204, and a GET then returned 404.

  /api/agents/{agent_id}/chat:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [Interaction]
      summary: Chat with an agent
      description: |
        Sends a message to the agent and waits for its reply. Messages take
        the same delivery path as Telegram and webhooks. A sleeping agent
        wakes automatically, so the first call after a sleep takes longer.

        Replies typically take a few seconds. Agents running custom containers
        must respond within 30 seconds.

        An empty `message` isn't rejected; the agent receives it and replies.

        If an agent template lacks a model key Maritime cannot proxy (for
        example, Claude Code without `ANTHROPIC_API_KEY`), the endpoint still
        returns `200 OK` with an advisory message in `response` explaining that
        the key is missing.

        Similarly, if the account has reached its plan limit for concurrently
        awake machines (such as 1 machine on the Free plan), chatting with a
        sleeping agent does not return `429`; it returns `200 OK` 
        with an advisory message in `response` stating that the agent
        can't be woken, and the agent remains asleep.
      operationId: chatWithAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
            example:
              message: summarize today
      responses:
        '200':
          description: The agent's reply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
              examples:
                standard:
                  summary: Normal agent reply
                  value:
                    response: hello from oas test
                wakeLimitReached:
                  summary: Concurrently awake machines limit reached
                  value:
                    response: "This agent can't be woken right now: You have 1 machines awake. Your plan permits 1. Sleep a machine, or upgrade your plan: https://maritime.sh/billing"
        '401':
          $ref: '#/components/responses/InvalidKey'
        '403':
          $ref: '#/components/responses/MissingKey'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      x-verification:
        status: verified
        date: '2026-10-08'
        notes: >-
          Request/response shape, 404 and 422 verified (about 2-4 s per reply).
          An empty message, unicode and emoji, and unknown extra fields were
          accepted; a numeric conversation_id returned 422. Chatting with a
          sleeping agent woke it and replied in 3.5 s. conversation_id was
          accepted, but on a zeroclaw agent a second message in the same
          conversation did not recall the first; continuity appears to be
          framework-dependent. On 2026-10-04: chat without custom model
          credentials was verified on openclaw (replied through the Maritime LLM proxy).
          On 2026-10-08: chatting with a sleeping agent while another machine was
          active on the Free plan returned 200 OK in 0.56s with an advisory
          response string rather than 429, and the sleeping agent remained asleep.
          in 9.3 s) and claude_code (returned 200 in 1.0 s with an advisory
          string noting missing ANTHROPIC_API_KEY). The response does not echo
          a conversation ID.

  /api/agents/{agent_id}/exec:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [Interaction]
      summary: Run a command
      description: |
        Runs a one-shot, non-interactive shell command in the agent's VM and
        returns its exit code and output. Wakes a sleeping agent.

        - `command` is either an argument array (tokens are quoted
          automatically) or a raw shell string.
        - Standard output and standard error are merged into one stream,
          returned in `stdout`. `stderr` is currently always empty.
        - Output is limited to 256 KiB (262,144 bytes). Output exceeding this
          limit keeps the trailing 256 KiB, prefixed with `[output truncated]\n`.
        - A non-zero exit code still returns `200 OK`; check `exitCode`. A
          command that doesn't exist returns `200 OK` with exit code `127`.
        - If the command exceeds `timeout`, the call returns `502` with
          `Exec failed`. Timeouts greater than 120 seconds are clamped to
          120 seconds.
        - Commands run as `root`, with `/` as the working directory and
          `$HOME`.
      operationId: execInAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecRequest'
            examples:
              argv:
                summary: Argv tokens
                value:
                  command: [ls, -la, /zeroclaw-data/oas]
                  timeout: 30
              shell:
                summary: Raw shell string
                value:
                  command: 'echo out; echo err 1>&2; exit 3'
      responses:
        '200':
          description: The command was executed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecResponse'
              examples:
                success:
                  summary: Exit code 0
                  value:
                    exitCode: 0
