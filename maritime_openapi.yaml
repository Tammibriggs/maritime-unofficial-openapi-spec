  /api/agents/{agent_id}/files/download:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Files]
      summary: Download a file
      description: |
        Streams a file out of the agent's container as an attachment. Unlike
        the other file endpoints, `path` can be any absolute path in the
        container, not just the volume, because agents also write to `/tmp`
        and workspace directories. The `Content-Type` is guessed from the
        file extension.

        A directory returns `400`. **An empty (zero-byte) file returns
        `404 File not found`**, even though List files shows it with
        `size: 0`.
      operationId: downloadAgentFile
      parameters:
        - name: path
          in: query
          required: true
          description: Absolute path of the file in the container.
          schema:
            type: string
          example: /data/report.pdf
      responses:
        '200':
          description: The file contents.
          headers:
            Content-Disposition:
              description: |
                Always `attachment`, with the file's base name. For a non-ASCII
                name, `filename` is an ASCII fallback with those characters
                dropped, and `filename*` carries the full UTF-8 name, for
                example `attachment; filename="caf notes.md";
                filename*=UTF-8''caf%C3%A9%20notes.md`.
              schema:
                type: string
              example: attachment; filename="report.csv"
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '400':
          description: The path is a directory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: path is a directory
        '401':
          $ref: '#/components/responses/InvalidKey'
        '403':
          $ref: '#/components/responses/MissingKey'
        '404':
          description: The file doesn't exist or is empty, or the agent wasn't found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: File not found
        '422':
          $ref: '#/components/responses/ValidationFailed'
      x-verification:
        status: verified
        date: '2026-10-04'
        notes: >-
          Downloaded a file from the volume (served as text/csv) and from /tmp
          (text/plain). On 2026-10-04: a directory returned 400 "path is a
          directory"; a zero-byte file written with write returned 404 "File
          not found"; a file named "café notes.md" downloaded with the
          filename* header shown above and Content-Type text/markdown. The
          docs page's example path /data/report.pdf returned 404. The 100 MB
          cap was not tested.

  /api/agents/{agent_id}/files/upload:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [Files]
      summary: Upload a file
      description: |
        Uploads one file (up to 100 MB) into the agent's container. There are
        two modes:

        - **To a directory**: send `dest_dir`. The file lands in that
          directory with its original base name (a name like `../evil.csv`
          is saved as `evil.csv`). The directory is created if it doesn't
          exist. An existing file with the same name is overwritten without
          warning. If you also send `message`, the file still goes to
          `dest_dir` (whether the agent is notified wasn't checked).
        - **As a chat attachment**: omit `dest_dir`. The file is saved to the
          agent's inbox (`<volume>/workspace/inbox/`) with a Unix-timestamp
          prefix, and the agent is notified in its current conversation.
          Include `message` to send text with it.

        Uploaded files are never executed.
      operationId: uploadAgentFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadRequest'
            encoding:
              file:
                contentType: application/octet-stream
      responses:
        '200':
          description: The file was saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
              examples:
                toDirectory:
                  summary: With dest_dir
                  value:
                    ok: true
                    path: /zeroclaw-data/oas/inbox/report.csv
                    name: report.csv
                    size: 24
                asAttachment:
                  summary: Without dest_dir (chat attachment)
                  value:
                    ok: true
                    path: /zeroclaw-data/workspace/inbox/1791028078-report.csv
                    name: report.csv
                    size: 24
        '400':
          description: '`dest_dir` is outside the agent''s volume.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Invalid destination
        '401':
          $ref: '#/components/responses/InvalidKey'
        '403':
          $ref: '#/components/responses/MissingKey'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      x-verification:
        status: partial
        date: '2026-10-04'
        notes: >-
          Both modes, silent overwrite, and the 422 for a missing file part were
          verified. On 2026-10-04: dest_dir /tmp and the docs page's example
          /data/inbox both returned 400 "Invalid destination" (note: not
          "Invalid path"); a dest_dir that didn't exist was created; the
          filename ../evil.csv was saved as evil.csv; a zero-byte file was
          accepted (size 0); dest_dir plus message saved to dest_dir. The
          100 MB cap was not tested.

