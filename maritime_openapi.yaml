  /api/agents/{agent_id}/logs:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Interaction]
      summary: Get agent logs
      description: |
        Returns the agent's log entries, newest first. To page back through
        older entries, pass the `timestamp` of the last entry you received as
        `before`.
      operationId: getAgentLogs
      parameters:
        - name: limit
          in: query
          description: Maximum number of entries to return. `0` is accepted and returns an empty array.
          schema:
            type: integer
            minimum: 0
            maximum: 1000
            default: 100
          example: 100
        - name: level
          in: query
          description: Only return entries at this level. Matching is case-insensitive (`INFO` works like `info`).
          schema:
            type: string
            enum: [debug, info, warn, error]
          example: error
        - name: before
          in: query
          description: Only return entries strictly older than this ISO 8601 timestamp. Use it as a pagination cursor.
          schema:
            type: string
            format: date-time
          example: '2026-10-03T11:42:40Z'
      responses:
        '200':
          description: Log entries, newest first. An empty array if none match.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogEntry'
              example:
                - id: 565a8d18-4294-4e4d-a5b5-97606e54b6a5
                  agentId: e25829dd-175b-4be2-97b8-f0939bb9de9f
                  level: info
                  message: Webhook received with 1 keys
                  timestamp: '2026-10-03T11:50:10.623090Z'
                  source: webhook
                - id: 6b019e54-9efb-496e-be3a-7fee530a7f47
                  agentId: e25829dd-175b-4be2-97b8-f0939bb9de9f
                  level: info
                  message: Agent deployed and running
                  timestamp: '2026-10-03T11:42:47.577748Z'
                  source: system
        '401':
          $ref: '#/components/responses/InvalidKey'
        '403':
          $ref: '#/components/responses/MissingKey'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '422':
          description: '`limit` is out of range or not a number, `before` is not a date-time, or `level` is not a known level.'
          content:
            application/json:
              schema:
                anyOf: 
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'
              examples:
                badLevel:
                  summary: Unknown level (string detail)
                  value:
                    detail: "Unknown log level 'bogus'; expected one of ['debug', 'error', 'info', 'warn']"
                badLimit:
                  summary: Limit above 1000 (validation array)
                  value:
                    detail:
                      - type: less_than_equal
                        loc: [query, limit]
                        msg: Input should be less than or equal to 1000
                        input: '5000'
                        ctx:
                          le: 1000
      x-verification:
        status: verified
        date: '2026-10-04'
        notes: >-
          On 2026-10-04: limit 0 returned 200 with an empty array; limit 1 and
          1000 returned 200; limit=abc and before=yesterday returned 422
          arrays; level=INFO passed validation and returned info entries. The
          docs page's example (limit=100&level=error) returned 200.

  /api/agents/{agent_id}/files/list:
