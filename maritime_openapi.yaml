  /api/webhooks/{agent_id}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [Webhooks]
      summary: Invoke an agent by webhook
      description: |
        This is an incoming webhook: you or an external service send data to
        Maritime, which delivers it to the agent.

        Accepts any JSON payload and delivers it to the agent in the
        background, waking the agent first if it's asleep. The call returns as
        soon as the payload is accepted; it doesn't wait for the agent to finish
        processing.

        Authenticate using the agent's invoke token, either in the
        `X-Maritime-Webhook-Token` header or in the `token` query parameter. To
        retrieve the token, see
        [Get the webhook token](#operation/getWebhookToken). Your personal
        `mk_` API key isn't used for webhooks.

        **Token enforcement isn't active yet.** Requests with a missing or
        invalid token are currently accepted. However, unauthenticated calls
        will be phased out, so always send the token.

        Webhook calls are rate-limited to 30 calls per minute for each agent
        and caller, and share the agent's message budget. When the limit is
        exceeded, the call returns `429 Too Many Requests` with a `Retry-After`
        header indicating wait time in seconds. Requests aren't queued.

        The request body isn't validated. Plain text, invalid JSON, an empty
        body, and a JSON array are all accepted with `200 OK` and delivered.
      operationId: invokeAgentWebhook
      security:
        - WebhookTokenHeader: []
        - WebhookTokenQuery: []
        - {}
      requestBody:
        required: false
        description: Any JSON object, delivered to the agent as-is. Other body formats are also accepted, as described in the endpoint overview.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example:
              event: order.created
              orderId: A-1001
      responses:
        '200':
          description: |
            The payload was accepted for delivery.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Agent'
                  - $ref: '#/components/schemas/WebhookAccepted'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '429':
          description: Rate limit exceeded (30 calls per minute for each agent and caller).
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
              example: 44
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: 'Rate limit exceeded: 30/min for public-webhook'
      x-verification:
        status: partial
        date: '2026-10-04'
        notes: >-
          Header token, query token, no token, and an incorrect token all
          returned 200 with the agent record, and all four payloads reached the
          agent (logged as "Webhook received with N keys", source "webhook"). No
          deprecation header is sent. On 2026-10-04: after 8 invokes, a burst of
          35 received 22 x 200 then 13 x 429, so the 31st call in the minute was
          refused, with Retry-After 44 and the detail shown in the response;
          text/plain, invalid JSON, and an empty body were delivered as "0 keys",
          and a 3-item array as "3 keys". The {"status": "accepted"} format only
          appears once Maritime enforces tokens, and was not observed.

  /api/webhooks/{agent_id}/token:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Webhooks]
      summary: Get the webhook token
      description: |
        Returns the agent's invoke token and a ready-to-use invoke URL with
        the token in its query string. The token is derived from the agent,
        so it stays the same for the agent's lifetime unless you rotate it.
        Treat it as a secret: anyone holding it can invoke the agent.
      operationId: getWebhookToken
      responses:
        '200':
          description: The agent's invoke token and URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookToken'
              example:
                agentId: e25829dd-175b-4be2-97b8-f0939bb9de9f
                token: wht_REDACTED
                header: X-Maritime-Webhook-Token
                url: https://api.maritime.sh/api/webhooks/e25829dd-175b-4be2-97b8-f0939bb9de9f?token=wht_REDACTED
                source: derived
        '401':
          $ref: '#/components/responses/InvalidKey'
        '403':
          $ref: '#/components/responses/MissingKey'
        '404':
          $ref: '#/components/responses/AgentNotFound'
      x-verification:
        status: verified
        date: '2026-10-04'
        notes: >-
          Token value redacted in the example; its real format is not shown
          in this specification. Two calls on 2026-10-04 returned the same token.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        A personal API key with the `mk_` prefix. Generate an API key in the
        Maritime dashboard (navigate to **Settings** and select **API keys**)
        or by running `maritime keys create`.
    WebhookTokenHeader:
      type: apiKey
      in: header
      name: X-Maritime-Webhook-Token
      description: The agent's invoke token, passed as a request header. Used only by the webhook invoke endpoint.
    WebhookTokenQuery:
      type: apiKey
      in: query
      name: token
      description: The agent's invoke token, passed as a query parameter. Used only by the webhook invoke endpoint.

  parameters:
    AgentId:
      name: agent_id
      in: path
      required: true
      description: The agent's ID (a UUID), as returned in the `id` field of an agent object.
      schema:
        type: string
        format: uuid
      example: e25829dd-175b-4be2-97b8-f0939bb9de9f

  responses:
    MissingKey:
      description: No `Authorization` header was sent, the key was sent without the `Bearer` prefix or in an `X-API-Key` header, or the key lacks the scope or project access that this operation requires.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing:
              summary: Missing or malformed authentication header
              value:
                detail: Not authenticated
            insufficientScope:
              summary: Insufficient scope for this operation
              value:
                detail: "This API key lacks the 'provision' scope required for this action."
            projectScoped:
              summary: Project-scoped key on core endpoints
              value:
                detail: "This API key is scoped to a project and is only valid on the /api/v1 partner endpoints (front door messages/users, usage) for that project."
    InvalidKey:
      description: The API key is invalid, expired, or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: Invalid token
    AgentNotFound:
      description: No agent with this ID exists in your account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: Agent e25829dd-175b-4be2-97b8-f0939bb9de9f not found
    InvalidPath:
      description: The path is outside the agent's persistent volume.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: Invalid path
    ValidationFailed:
      description: A required field or parameter is missing or has an invalid type.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            detail:
              - type: missing
                loc: [body, name]
                msg: Field required
                input:
                  templateId: zeroclaw

  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: A human-readable description of the error.
          example: Agent e25829dd-175b-4be2-97b8-f0939bb9de9f not found

    PlanLimitError:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: A human-readable explanation, including the plan's limit and a link to billing.
        code:
          type: string
          description: A machine-readable reason code, such as `seat_limit` (indicating the plan agent limit has been reached).
          example: seat_limit
        upgrade:
          type: boolean
          description: Whether upgrading the plan lifts the limit.
          example: true

    ValidationError:
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          description: A list of validation issues, with one entry per invalid field or parameter.
          items:
            $ref: '#/components/schemas/ValidationIssue'

    ValidationIssue:
      type: object
      required: [type, loc, msg]
      properties:
        type:
          type: string
          description: A machine-readable error type, such as `missing` or `less_than_equal`.
          example: missing
        loc:
          type: array
          description: 'Location of the validation error: the request component (`body`, `query`, or `path`) followed by the field name.'
          items:
            oneOf:
              - type: string
              - type: integer
          example: [body, name]
        msg:
          type: string
          description: A human-readable description of the problem.
          example: Field required
        input:
          description: The value that failed validation. Any JSON type, or null.
        ctx:
          type: object
          description: Extra details about the constraint that failed, such as `le` for a maximum.
          additionalProperties: true

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: '`ok` when the API is operational.'
          example: ok
        runtime:
          type: string
          description: The runtime environment of the API.
          example: fleet
        event_loop:
          type: object
          description: Latency statistics for the server event loop. Internal; subject to change.
          additionalProperties: true
        leader:
          type: object
          description: Scheduler leader-election state. Internal; subject to change.
          additionalProperties: true
        deploy_queue:
          type: object
          description: Deployment queue depth statistics. Internal; subject to change.
          additionalProperties: true

    Template:
      type: object
      required: [id, name, framework]
      properties:
        id:
          type: string
          description: The template identifier. Pass it as `templateId` when creating an agent.
          example: zeroclaw
        name:
          type: string
          description: The display name of the template.
          example: ZeroClaw Agent
        framework:
          type: string
          description: The agent framework used by the template. Templates built on a custom container return `custom`.
          example: zeroclaw
        image:
          type: string
          description: The container image deployed by the template.
          example: ghcr.io/zeroclaw-labs/zeroclaw:v0.8.5-debian
        description:
          type: string
          description: A short description of the template.
          example: Ultra-lightweight Rust AI agent. <5MB RAM, instant startup.
        tags:
          type: array
          description: Tags for categorizing the template.
          items:
            type: string
          example: [Lightweight, Rust]
        envRequired:
          type: array
          description: |
            Environment variables expected by the template. Most templates
            route through Maritime's LLM proxy by default if omitted; only
            templates unsupported by the proxy (like Claude Code) require the
            key to reach the model. An empty array means none.
          items:
            type: string
          example: []
        videoUrl:
          type: string
          format: uri
          nullable: true
          description: A URL for a demonstration video, if available.
          example: https://maritime.sh/videos/templates/zeroclaw.mp4
        hidden:
          type: boolean
          description: Whether the template is hidden from the public library.
          example: false

    AgentCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: A name for the agent.
          example: my-agent
        templateId:
          type: string
          nullable: true
          description: The template used to create the agent (see [List templates](#operation/listTemplates)). Sets `framework` automatically.
          example: zeroclaw
        description:
          type: string
          nullable: true
          description: A free-text description of the agent.
        instructions:
          type: string
          nullable: true
          description: Instructions for the agent.
        externalId:
          type: string
          nullable: true
          description: Your identifier for the user this agent belongs to. Usage reports include it as `externalUserId`.
        framework:
          type: string
          default: custom
          description: |
            The agent framework. When creating an agent from a template, omit
            this field; the platform determines the framework automatically from
            `templateId`. When deploying your own container image or GitHub
            repository without a template, set this field to `custom`.
          example: custom
        githubRepo:
          type: string
          nullable: true
          description: A GitHub repository URL with a Dockerfile at its root. Requires `framework` set to `custom`.
          example: https://github.com/acme/agent
        branch:
          type: string
          nullable: true
          description: The branch to build when using `githubRepo`.
          example: main
        imageName:
          type: string
          nullable: true
          description: A public container image to deploy. Private registries are not supported. Requires `framework` set to `custom`.
          example: ghcr.io/acme/agent:1.4.0
        initialEnvVars:
          type: array
          description: Environment variables to set on the agent at creation. Secret values are encrypted.
          items:
            $ref: '#/components/schemas/InitialEnvVar'
        useMaritimeLlm:
          type: boolean
          default: false
          description: Whether to inject Maritime's metered LLM proxy credentials (`OPENAI_API_KEY` and `OPENAI_BASE_URL`) into the agent.
        tier:
          type: string
          default: always_on
          description: 'The agent''s hosting tier. Supported value: `always_on`.'
        memMb:
          type: integer
          nullable: true
          description: Memory in megabytes. Leave unset for the default size.
        vcpus:
          type: number
          nullable: true
          description: Number of virtual CPUs. Leave unset for the default size.
        diskGb:
          type: number
          nullable: true
          description: Persistent volume size in gigabytes. When omitted or null, the platform provisions the default storage size allocated for the agent tier (returned as null in `diskMb`).
        idleTtlSeconds:
          type: integer
          nullable: true
          description: Seconds of inactivity before the agent sleeps. Leave unset for the default.
        computeMinutesLimit:
          type: number
          nullable: true
          description: A cap on the agent's compute minutes. Unset means no cap.
        exposedPort:
          type: integer
          nullable: true
          description: For custom containers, the port your HTTP server listens on.
        healthCheckPath:
          type: string
          nullable: true
          description: For custom containers, the path that answers health checks (for example, `/health`).
        hasWebUi:
          type: boolean
          default: true
          description: Whether the agent serves a web UI.
        publicWeb:
          type: boolean
          default: false
          description: Whether to serve the agent on a public, unauthenticated HTTPS URL.
        autoPair:
          type: boolean
          default: true
          description: Whether to automatically authorize and pair client connections with the agent upon deployment.
        desktop:
          type: boolean
          default: false
          description: Whether to enable desktop environment support. When enabled, sets `desktopEnabled` to `true` on the agent.
        gatewayPassword:
          type: string
          nullable: true
          description: Password for gateway authentication, if required by the deployment.
        serverId:
          type: string
          nullable: true
          description: Identifier of the server host running the agent.
        uploadS3Key:
          type: string
          nullable: true
          description: S3 object key referencing an uploaded archive for direct deployment.
        addOns:
          type: array
          description: Billing add-ons enabled for the agent, including extra RAM or persistent storage.
          items:
            type: string

    InitialEnvVar:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
          example: OPENAI_API_KEY
        value:
          type: string
          example: sk-...
        isSecret:
          type: boolean
          default: true
          description: Whether to store the value encrypted and hide it in the dashboard.

    Agent:
      type: object
      required: [id, name, framework, tier, status, invocationCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier (UUID) of the agent.
        name:
          type: string
        description:
          type: string
          nullable: true
        instructions:
          type: string
          nullable: true
        externalId:
          type: string
          nullable: true
          description: Your identifier for the end user this agent belongs to, if set.
        framework:
          type: string
          description: The agent framework, for example `openclaw`, `zeroclaw`, `hermes`, `dsh`, or `custom`.
          example: zeroclaw
        tier:
          type: string
          description: 'The agent hosting tier. Supported value: `always_on`.'
          example: always_on
        status:
          type: string
          description: |
            The lifecycle state of the agent. Valid values:
            - `deploying`: The agent is provisioning and starting up.
            - `active`: The agent is running and ready to receive requests.
            - `sleeping`: The agent is idle and paused; wakes automatically on the next request.
          example: active
        templateId:
          type: string
          nullable: true
          description: The identifier of the template used to create the agent.
          example: zeroclaw
        githubRepo:
          type: string
          nullable: true
        autoPair:
          type: boolean
          description: Whether automatic client pairing was enabled for the agent.
        exposedPort:
          type: integer
          nullable: true
        healthCheckPath:
          type: string
          nullable: true
        hasWebUi:
          type: boolean
        publicPlay:
          type: boolean
        publicWeb:
          type: boolean
          description: Whether the agent is served on a public URL.
        publicUrl:
          type: string
          nullable: true
          description: The public URL, when `publicWeb` is true.
        desktopEnabled:
          type: boolean
        invocationCount:
          type: integer
          description: Number of times the agent has been invoked through chat and webhooks.
        totalComputeSeconds:
          type: integer
          description: Total number of seconds the agent has been awake.
        memMb:
          type: integer
          nullable: true
          description: Memory override in MB, or null for the default.
        vcpus:
          type: number
          nullable: true
          description: vCPU override, or null for the default.
        idleTtlSeconds:
          type: integer
          nullable: true
          description: Idle-sleep override in seconds, or null for the default.
        diskMb:
          type: integer
          nullable: true
          description: Disk override in MB, or null for the default. Note the create field is `diskGb`.
        computeMinutesLimit:
          type: number
          nullable: true
        sleepPolicy:
          type: string
          example: auto-sleep
        lastStartedAt:
          type: string
          format: date-time
          nullable: true
        lastActiveAt:
          type: string
          format: date-time
          nullable: true
          description: When the agent last did work.
        derivedImageTag:
          type: string
          nullable: true
        browserbaseConfigured:
          type: boolean
        projectId:
          type: string
          nullable: true
          description: The project the agent belongs to. Some endpoints, such as channel setup, take this ID.
        projectRole:
          type: string
          nullable: true
          example: base
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: The message to send to the agent.
          example: summarize today
        conversation_id:
          type: string
          nullable: true
          description: |
            An identifier of your choosing to continue an earlier thread.
            Whether the agent remembers earlier messages depends on its
            framework.
          example: support-thread-42

    ChatResponse:
      type: object
      required: [response]
      properties:
        response:
          type: string
          description: The agent's reply as plain text.
          example: Here's today's summary...

    ExecRequest:
      type: object
      required: [command]
      properties:
        command:
          description: The command to run, as an argument array (tokens are quoted automatically) or a raw shell string.
          oneOf:
            - type: array
              minItems: 1
              items:
                type: string
            - type: string
              minLength: 1
          example: [ls, -la, /zeroclaw-data/oas]
        timeout:
          type: integer
          minimum: 1
          maximum: 120
          default: 60
          description: |
            Timeout in seconds before the command is terminated. Values greater
            than 120 are clamped to 120. A negative value returns `502 Bad
            Gateway`.
          example: 30

    ExecResponse:
      type: object
      required: [exitCode, stdout, stderr]
      properties:
        exitCode:
          type: integer
          description: The command exit code.
          example: 0
        stdout:
          type: string
          description: Combined standard output and standard error, limited to 256 KiB. Truncated output retains the last 256 KiB, prefixed with `[output truncated]\n`.
        stderr:
          type: string
          description: Always empty, because standard error is merged into `stdout`.
          example: ''
    LogEntry:
      type: object
      required: [id, agentId, level, message, timestamp, source]
      properties:
        id:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        level:
          type: string
          enum: [debug, info, warn, error]
        message:
          type: string
          example: Agent deployed and running
        timestamp:
          type: string
          format: date-time
          description: When the entry was written. Use it as `before` to fetch older entries.
        source:
          type: string
          description: 'The source of the log entry. Supported values include `system` (platform events), `container` (the agent process), and `webhook` (webhook activity).'
          example: system

    FileListing:
      type: object
      required: [path, root, entries]
      properties:
        path:
          type: string
          description: The directory that was listed.
          example: /zeroclaw-data
        root:
          type: string
          description: |
            The agent's volume root (for example, `/data` for `openclaw`,
            `codex`, and `dsh`; `/zeroclaw-data` for `zeroclaw`; or `/opt/data`
            for `hermes`). Use this value to build paths for the other file
            endpoints.
          example: /zeroclaw-data
        entries:
          type: array
          items:
            $ref: '#/components/schemas/FileEntry'

    FileEntry:
      type: object
      required: [name, isDir, size, mtime]
      properties:
        name:
          type: string
          example: notes.md
        isDir:
          type: boolean
          example: false
        size:
          type: integer
          description: Size in bytes.
          example: 182
        mtime:
          type: integer
          description: Last-modified time as Unix seconds.
          example: 1791027942

    UploadRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: The file to upload. Maximum 100 MB.
        dest_dir:
          type: string
          description: A directory within the volume where the file is saved. Omit this field to send the file as a chat attachment.
          example: /zeroclaw-data/oas/inbox
        message:
          type: string
          description: Text sent to the agent along with a chat attachment. Intended for when `dest_dir` is omitted. If `dest_dir` is specified, the file is still saved to that directory.
          example: Here is the report, how many rows does it have?

    UploadResponse:
      type: object
      required: [ok, path, name, size]
      properties:
        ok:
          type: boolean
          example: true
        path:
          type: string
          description: The path where the file was saved.
          example: /zeroclaw-data/oas/inbox/report.csv
        name:
          type: string
          description: The original file name.
          example: report.csv
        size:
          type: integer
          description: Size in bytes.
          example: 5321

    PathRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: An absolute path within the agent's volume.
          example: /zeroclaw-data/oas/inbox

    WriteFileRequest:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
          description: An absolute file path within the agent's volume.
          example: /zeroclaw-data/oas/notes.md
        content:
          type: string
          description: The full file contents, as UTF-8 text.
          example: "# Notes\n"

    PathResult:
      type: object
      required: [ok, path]
      properties:
        ok:
          type: boolean
          example: true
        path:
          type: string
          description: The path that was acted on.
          example: /zeroclaw-data/oas/notes.md

    MoveRequest:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          description: The existing path.
          example: /zeroclaw-data/oas/notes.md
        to:
          type: string
          description: The new path. Must not already exist.
          example: /zeroclaw-data/oas/inbox/notes.md

    MoveResult:
      type: object
      required: [ok, from, to]
      properties:
        ok:
          type: boolean
          example: true
        from:
          type: string
          example: /zeroclaw-data/oas/notes.md
        to:
          type: string
          example: /zeroclaw-data/oas/inbox/notes.md

    WebhookToken:
      type: object
      required: [agentId, token, header, url]
      properties:
        agentId:
          type: string
          format: uuid
        token:
          type: string
          description: The invoke token. Treat this value as a secret.
        header:
          type: string
          description: The header name to send the token in.
          example: X-Maritime-Webhook-Token
        url:
          type: string
          format: uri
          description: The invoke URL with the token included as a query string.
        source:
          type: string
          description: How the token was generated, such as `derived`.
          example: derived

    WebhookAccepted:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted]
