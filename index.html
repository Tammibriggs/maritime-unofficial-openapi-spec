<!doctype html>
<html lang="en">
  <head>
    <title>Maritime API Reference</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta
      name="description"
      content="Comprehensive reference documentation for the Maritime REST API."
    />
    <style>
      body {
        margin: 0;
        padding: 0;
      }

      /* Hide Client Libraries components, tabs, and rows */
      .client-libraries,
      .client-libraries-heading,
      .client-libraries-content,
      .client-libraries-list,
      .client-libraries-tabs,
      .client-libraries-more,
      .client-libraries-row,
      .selected-client,
      [class*="client-libraries"],
      .introduction-card-item:has([class*="client-libraries"]),
      .introduction-card-row:has([class*="client-libraries"]) {
        display: none !important;
      }

      /* Quickstart item styling in desktop sidebar and mobile navigation drawer */
      #scalar-custom-quickstart,
      .custom-quickstart-item,
      .scalar-custom-quickstart,
      [data-custom-quickstart="true"] {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      #scalar-custom-quickstart a,
      .custom-quickstart-item a,
      .scalar-custom-quickstart a,
      [data-custom-quickstart="true"] a {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        color: var(--scalar-color-2, #9ca3af);
        font-size: 13.5px;
        font-weight: 500;
        text-decoration: none;
        border-radius: 6px;
        transition: all 0.15s ease;
      }

      #scalar-custom-quickstart a:hover,
      .custom-quickstart-item a:hover,
      .scalar-custom-quickstart a:hover,
      [data-custom-quickstart="true"] a:hover {
        color: var(--scalar-color-1, #f9fafb);
        background: var(--scalar-background-2, rgba(125, 125, 125, 0.1));
      }

      /* Temporarily hide OpenAPI spec download button */
      .download-button,
      [class*="download-button"],
      button[aria-label*="Download" i],
      a[aria-label*="Download" i],
      a[download] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <script
      id="api-reference"
      data-url="./maritime_openapi.yaml"
      data-configuration='{
        "theme": "default",
        "layout": "modern",
        "showSidebar": true,
        "defaultOpenAllTags": true,
        "maxVisibleRequestBodyProperties": 0,
        "proxyUrl": "https://proxy.scalar.com",
        "searchHotKey": "k",
        "documentDownloadType": "none",
        "hideDownloadButton": true,
        "metaData": {
          "title": "Maritime API Reference",
          "description": "Comprehensive reference documentation for the Maritime REST API."
        }
      }'>
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>

    <script>
      function cleanScalarUI() {
        // 1. Hide "Client Libraries" text item in the sidebar and anywhere in page
        document.querySelectorAll('*').forEach((el) => {
          if (el.children.length === 0) {
            const text = el.textContent ? el.textContent.trim() : '';
            if (/^client\s+libraries$/i.test(text)) {
              const item = el.closest('.introduction-card-item') || el.closest('.introduction-card-row') || el.closest('li') || el.closest('button') || el.closest('[class*="item"]') || el.parentElement || el;
              item.style.setProperty('display', 'none', 'important');
            }
          }
        });

        // 2. Hide Client Libraries content rows (without hiding the whole .introduction-card wrapper)
        document.querySelectorAll('.client-libraries, .selected-client, [class*="client-libraries"]').forEach((el) => {
          const item = el.closest('.introduction-card-item') || el.closest('.introduction-card-row') || el.closest('[class*="item"]') || el;
          item.style.setProperty('display', 'none', 'important');
        });

        // 3. Keep the introduction card container visible for Scalar's native Server component, while hiding Authentication and Client Libraries items
        const introCardContainer = document.querySelector('.introduction-card, [class*="introduction-card"]');
        if (introCardContainer) {
          introCardContainer.style.removeProperty('display');

          introCardContainer.querySelectorAll('.introduction-card-item, .introduction-card-row, [class*="card-item"]').forEach((item) => {
            const text = item.textContent || '';
            if (/authentication|security/i.test(text) || /client\s+libraries/i.test(text)) {
              item.style.setProperty('display', 'none', 'important');
            }
          });
        }

        // 4. Temporarily hide any OpenAPI spec download button elements in the introduction section
        document.querySelectorAll('button, a').forEach((el) => {
          const text = el.textContent ? el.textContent.trim() : '';
          const aria = el.getAttribute('aria-label') || '';
          if (/download\s+(openapi|spec|document|file)/i.test(text) || /^download$/i.test(text) || /download/i.test(aria)) {
            const introParent = el.closest('.introduction, [id*="introduction"], [data-section-id*="introduction"], main section:first-of-type, .introduction-card');
            if (introParent) {
              el.style.setProperty('display', 'none', 'important');
            }
          }
        });

        // 5. Ensure "Quickstart" is the first link in navigation lists (both desktop sidebar and mobile drawer)
        const targetLists = [];

        // Check desktop sidebar and mobile navigation drawer containers
        const containers = document.querySelectorAll(
          'aside, .references-sidebar, .t-doc__sidebar, [class*="sidebar"], [role="dialog"], dialog, [class*="drawer"], [class*="modal"], nav.scalar-navigation, .scalar-card, .scalar-app nav'
        );
        containers.forEach((container) => {
          container.querySelectorAll('ul, nav').forEach((el) => {
            if (!targetLists.includes(el)) targetLists.push(el);
          });
          if ((container.tagName === 'NAV' || container.tagName === 'UL') && !targetLists.includes(container)) {
            targetLists.push(container);
          }
        });

        // Also check any UL or NAV on the page
        document.querySelectorAll('ul, nav').forEach((el) => {
          if (!targetLists.includes(el)) targetLists.push(el);
        });

        // Filter to lists that actually contain an "Introduction" navigation item
        const navGroups = targetLists.filter((list) => {
          return Array.from(list.children).some((child) => {
            const text = child.textContent?.trim().toLowerCase();
            return text && text.startsWith('introduction');
          });
        });

        navGroups.forEach((group) => {
          let customItem = group.querySelector('[data-custom-quickstart="true"]');

          if (!customItem) {
            // Find sample item (preferably Introduction) to clone structure & styling
            const sampleItem = Array.from(group.children).find((child) => {
              const text = child.textContent?.trim().toLowerCase();
              return text && text.startsWith('introduction');
            }) || group.firstElementChild;

            if (sampleItem) {
              // Clone existing item so it inherits exact typography, layout, and classes
              customItem = sampleItem.cloneNode(true);
              customItem.setAttribute('data-custom-quickstart', 'true');
              customItem.classList.add('scalar-custom-quickstart');

              // Strip active/selected styling from the clone
              customItem.classList.remove('active', 'selected', 'router-link-active', 'router-link-exact-active');
              customItem.querySelectorAll('.active, [class*="active"], [class*="selected"], [aria-current]').forEach((el) => {
                el.classList.remove('active', 'selected');
                el.removeAttribute('aria-current');
              });

              // Update anchor / text to Quickstart
              const anchor = customItem.tagName === 'A' ? customItem : customItem.querySelector('a');
              if (anchor) {
                anchor.href = './quickstart.html';
                anchor.setAttribute('href', './quickstart.html');
                anchor.removeAttribute('aria-current');
                anchor.classList.remove('active', 'selected', 'router-link-active', 'router-link-exact-active');

                // Replace text content while preserving any icon element
                const textEl = anchor.querySelector('[class*="text"], [class*="title"], span') || anchor;
                textEl.textContent = 'Quickstart';
              } else {
                customItem.textContent = 'Quickstart';
              }
            } else {
              // Fallback creation
              customItem = document.createElement('li');
              customItem.setAttribute('data-custom-quickstart', 'true');
              customItem.className = 'sidebar-item custom-quickstart-item scalar-custom-quickstart';

              const customLink = document.createElement('a');
              customLink.href = './quickstart.html';
              customLink.className = 'sidebar-heading';
              customLink.textContent = 'Quickstart';

              customItem.appendChild(customLink);
            }

            // Intercept click in capture phase to guarantee direct navigation to quickstart.html
            customItem.addEventListener('click', (e) => {
              if (!e.ctrlKey && !e.metaKey && !e.shiftKey) {
                e.preventDefault();
                e.stopPropagation();
                window.location.href = './quickstart.html';
              }
            }, true);

            group.insertBefore(customItem, group.firstElementChild);
          } else if (group.firstElementChild !== customItem && customItem.parentElement === group) {
            // Ensure Quickstart stays the very first link in this group
            group.insertBefore(customItem, group.firstElementChild);
          }

          // Clean up sub-items under Introduction in this list (such as nested Authentication or duplicate items)
          group.querySelectorAll('*').forEach((el) => {
            if (el.children.length === 0) {
              const text = el.textContent?.trim();
              if (/^quickstart$/i.test(text)) {
                const item = el.closest('li') || el.closest('button') || el.closest('[class*="item"]') || el.parentElement;
                if (item && !item.hasAttribute('data-custom-quickstart') && !item.closest('[data-custom-quickstart="true"]')) {
                  item.style.setProperty('display', 'none', 'important');
                }
              }
            }
          });
        });
      }

      const observer = new MutationObserver(cleanScalarUI);
      observer.observe(document.documentElement, { childList: true, subtree: true });
      document.addEventListener('DOMContentLoaded', cleanScalarUI);
      window.addEventListener('load', cleanScalarUI);
      window.addEventListener('resize', cleanScalarUI);

      // Trigger when mobile menu or other navigation buttons are clicked
      document.addEventListener('click', (e) => {
        const btn = e.target.closest('button, [role="button"], a');
        if (btn) {
          requestAnimationFrame(cleanScalarUI);
          setTimeout(cleanScalarUI, 50);
          setTimeout(cleanScalarUI, 150);
          setTimeout(cleanScalarUI, 350);
        }
      }, true);

      const intervalId = setInterval(cleanScalarUI, 300);
      setTimeout(() => clearInterval(intervalId), 10000);
    </script>
  </body>
</html>
